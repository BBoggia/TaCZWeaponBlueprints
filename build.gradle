        def packagedSuite =
                'com.gamergaming.taczweaponblueprints.resource.research.DefaultTaCZResearchTreeTest'
        def requiredCases = [
                [invariant: 'grouped_strategy_controls_are_explicit',
                        suite: policySuite,
                        test: 'groupedRouteRolloutControlsAreExplicitAndBounded()'],
                [invariant: 'format_three_strategy_contract_is_strict',
                        suite: profileSuite,
                        test: 'automaticPlacementProfilesAreStrictBoundedAndUniquePerTree()'],
                [invariant: 'selected_pairs_publish_as_one_inclusive_or_group',
                        suite: plannerSuite,
                        test: 'groupedRoutesReuseSelectedParentsAsOneAnyOfGroup()'],
                [invariant: 'rank_and_branch_plans_are_deterministic',
                        suite: plannerSuite,
                        test: 'groupedRoutesAreIdenticalAcrossRepeatedRuns()'],
                [invariant: 'grouped_merge_interval_is_planner_inert',
                        suite: plannerSuite,
                        test: 'groupedRoutesIgnoreMergeIntervalAcrossLegacyScoreLayers()'],
                [invariant: 'generated_third_parents_are_prohibited',
                        suite: plannerSuite,
                        test: 'groupedRoutesRemainBoundedAtMaximumCatalogPopulation()'],
                [invariant: 'legacy_interval_still_only_schedules_optional_third_parents',
                        suite: plannerSuite,
                        test: 'mergeIntervalOnlySchedulesOptionalThirdParents()'],
                [invariant: 'conservative_union_closure_guard_remains_bounded',
                        suite: plannerSuite,
                        test: 'closureGuardAllowsLowCostRootsAndRejectsInflatedDisjointPaths()'],
                [invariant: 'authored_prerequisite_authority_is_unchanged',
                        suite: serviceSuite,
                        test: 'connectedAutomaticPrerequisiteIsEnforcedByTheAtomicResearchTransaction()'],
                [invariant: 'server_transactions_accept_either_grouped_route',
                        suite: serviceSuite,
                        test: 'groupedAutomaticRouteAcceptsEitherAlternativeButNotNeither()'],
                [invariant: 'public_graph_preserves_canonical_group_identity',
                        suite: builderSuite,
                        test: 'publishesCanonicalChoiceGroupsAndTheirPlayerSpecificSatisfaction()'],
                [invariant: 'network_sync_preserves_group_identity_and_cardinality',
                        suite: networkSuite,
                        test: 'groupedRequirementIdentityAndHiddenCountsRoundTrip()'],
                [invariant: 'diagnostics_and_export_publish_grouped_authority',
                        suite: diagnosticsSuite,
                        test: 'groupedRouteDiagnosticsAndExportExposeOneAlternativeGroup()'],
                [invariant: 'ui_edges_render_one_truthful_or_junction',
                        suite: edgeSuite,
                        test: 'anyOfAlternativesConvergeThroughOneStableJunctionAndOneArrow()'],
                [invariant: 'ui_text_discloses_only_visible_alternatives',
                        suite: textSuite,
                        test: 'partiallyPublishedAnyOfGroupNamesOnlyVisibleAlternatives()'],
                [invariant: 'tracked_routes_choose_one_deterministic_alternative',
                        suite: routePlannerSuite,
                        test: 'anyOfRequirementSelectsOneDeterministicLowCostRoute()'],
                [invariant: 'recommendations_understand_either_alternative',
                        suite: recommendationSuite,
                        test: 'eitherAlternativeInOneAnyOfGroupCanOpenTheDependent()'],
                [invariant: 'economy_counts_one_group_as_a_choice',
                        suite: economySuite,
                        test: 'oneAnyOfGroupIsAChoiceRatherThanAnAndMerge()'],
                [invariant: 'cross_domain_alternatives_do_not_become_mandatory_cost',
                        suite: economySuite,
                        test: 'crossDomainAlternativeDoesNotBecomeAMandatoryLocalCost()'],
                [invariant: 'attachments_and_ammo_remain_disabled_by_default',
                        suite: packagedSuite,
                        test: 'packagedTechTreeDefinesDynamicBandsAndDormantOptInDomains()']
        ]

        def parsedSuites = [:]
        def evidence = requiredCases.collect { required ->
            def suite = parsedSuites.computeIfAbsent(required.suite) { suiteName ->
                def result = file(
                        "${buildDir}/test-results/test/TEST-${suiteName}.xml")
                if (!result.isFile()) {
                    throw new GradleException(
                            "Phase 8 rollout suite did not run: ${suiteName}")
                }
                new XmlSlurper().parse(result)
            }
            def testCase = suite.testcase.find {
                it.@name.toString() == required.test
            }
            if (testCase == null || testCase.size() == 0) {
                throw new GradleException(
                        "Phase 8 rollout case did not run: ${required.suite}#${required.test}")
            }
            if (testCase.failure.size() != 0 || testCase.error.size() != 0
                    || testCase.skipped.size() != 0) {
                throw new GradleException(
                        "Phase 8 rollout case is not clean: ${required.suite}#${required.test}")
            }
            [
                    invariant: required.invariant,
                    suite    : required.suite,
                    test     : required.test,
                    status   : 'passed'
            ]
        }
        if (evidence*.invariant.toSet().size() != requiredCases.size()) {
            throw new GradleException(
                    'Phase 8 rollout matrix contains duplicate invariant identifiers')
        }

        def jsonParser = new groovy.json.JsonSlurper()
        def upstream = jsonParser.parse(groupedPrerequisiteAcceptanceReportFile.get().asFile)
        if (upstream['status'] != 'passed'
                || upstream['contract'] != certifiedGroupedPrerequisiteAcceptanceContract
                || upstream['prerequisiteStrategy'] != certifiedAutomaticPrerequisiteStrategy
                || upstream['networkProtocol'] != certifiedResearchTreeProtocol
                || upstream['exportFormat'] != certifiedResearchCatalogExportFormat) {
            throw new GradleException(
                    'Phase 8 rollout does not have matching Phase 7 acceptance evidence')
        }
        def automaticProfile = jsonParser.parse(file(
                'src/main/resources/data/taczweaponblueprints/taczweaponblueprints/research_automatic_placement_profiles/default.json'))
        def researchProfile = jsonParser.parse(file(
                'src/main/resources/data/taczweaponblueprints/taczweaponblueprints/research_profiles/duplicate_recovery.json'))
        def packagedMergeInterval = automaticProfile['merge_interval']
        if (automaticProfile['format'] != 4
                || automaticProfile['mode'] != 'connected'
                || automaticProfile['review_handling'] != 'place_connected'
                || automaticProfile['max_prerequisites'] != 2
                || automaticProfile['prerequisite_strategy']
                        != certifiedAutomaticPrerequisiteStrategy
                || automaticProfile['scoring_model']
                        != certifiedAutomaticScoringModel
                || !(packagedMergeInterval instanceof Number)
                || packagedMergeInterval.intValue() != packagedMergeInterval
                || packagedMergeInterval.intValue() < 0
                || packagedMergeInterval.intValue() > 64
                || researchProfile['domain_policies']?.get('weapons')
                        != [tree_enabled: true, research_enabled: true]
                || researchProfile['domain_policies']?.get('attachments')
                        != [tree_enabled: false, research_enabled: false]
                || researchProfile['domain_policies']?.get('ammo')
                        != [tree_enabled: false, research_enabled: false]) {
            throw new GradleException(
                    'Phase 8 packaged grouped-route or domain defaults drifted')
        }

        def report = [
                schema          : 1,
                phase           : 8,
                status          : 'passed',
                contract        : certifiedGroupedRouteRolloutContract,
                prerequisiteStrategy: certifiedAutomaticPrerequisiteStrategy,
                scoringModel   : certifiedAutomaticScoringModel,
                activation      : 'packaged_default_with_legacy_and_opt_out',
                selectedParentMapping: [
                        zero: 'none',
                        one : 'one_singleton_any_of_group',
                        two : 'one_two_alternative_any_of_group',
                        three: 'prohibited'
                ],
                maximumGeneratedPrerequisites: 2,
                mergeInterval   : [
                        configured: packagedMergeInterval,
                        groupedBehavior: 'ignored_grouped_routes_v1',
                        legacyCompatibility: 'strategy_and_layering_dependent'
                ],
                generatedParentCostGuard: 'group_aware_route_balance_v1',
                legacyGeneratedParentCostGuard:
                        'conservative_legacy_and_union_closure_v1',
                authoredAuthority: 'unchanged',
                defaultDomains  : [weapons: 'enabled', attachments: 'disabled', ammo: 'disabled'],
                networkProtocol : certifiedResearchTreeProtocol,
                exportFormat    : certifiedResearchCatalogExportFormat,
                upstreamAcceptance: [
                        contract: certifiedGroupedPrerequisiteAcceptanceContract,
                        report: 'build/reports/grouped-prerequisite-acceptance.json',
                        status: upstream['status']
                ],
                invariantCount  : evidence.size(),
                evidence        : evidence
        ]
        def output = groupedRouteRolloutReportFile.get().asFile
        output.parentFile.mkdirs()
        def reportText = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(report)) + '\n'
        def temporaryReport = java.nio.file.Files.createTempFile(
                output.parentFile.toPath(), 'grouped-rollout-', '.json.tmp')
        try {
            java.nio.file.Files.writeString(
                    temporaryReport,
                    reportText,
                    java.nio.charset.StandardCharsets.UTF_8)
            try {
                java.nio.file.Files.move(
                        temporaryReport,
                        output.toPath(),
                        java.nio.file.StandardCopyOption.ATOMIC_MOVE,
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
                java.nio.file.Files.move(
                        temporaryReport,
                        output.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        } finally {
            java.nio.file.Files.deleteIfExists(temporaryReport)
        }
        logger.lifecycle("Phase 8 grouped-route rollout report: ${output}")
    }
}

