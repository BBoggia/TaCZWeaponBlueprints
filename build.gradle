                    || profile['tech_entry_point_candidates']['ammo'].first() != 'tacz:9mm') {
                throw new GradleException(
                        'Packaged research profile must publish weapon research only while retaining authored domain entries')
            }
            def fallbackGunRulePath =
                    'data/taczweaponblueprints/taczweaponblueprints/research_rules/fallback_guns.json'
            if (!names.contains(fallbackGunRulePath)) {
                throw new GradleException('Packaged research data is missing the add-on gun fallback rule')
            }
            def fallbackGunRule = parsePackagedJson(fallbackGunRulePath)
            if (fallbackGunRule['visibility'] != 'preview'
                    || fallbackGunRule['tree_enabled'] != true
                    || fallbackGunRule['target']?.get('selector')?.get('blueprint_kinds') != ['gun']) {
                throw new GradleException(
                        'Packaged add-on gun fallback must be a selectable gun-only tree rule')
            }
            [
                    'fallback_attachments.json': 'attachment',
                    'fallback_ammo.json': 'ammo'
            ].each { fileName, blueprintKind ->
                def path = 'data/taczweaponblueprints/taczweaponblueprints/research_rules/' + fileName
                def rule = parsePackagedJson(path)
                if (rule['visibility'] != 'preview'
                        || rule['tree_enabled'] != true
                        || rule['research_enabled'] != true
                        || rule['research_cost']?.get('points') != 4
                        || rule['target']?.get('selector')?.get('blueprint_kinds') != [blueprintKind]) {
                    throw new GradleException(
                            "Packaged ${blueprintKind} fallback must be a selectable 4 RP kind-only tree rule")
                }
            }
            def prerequisitesByTarget = new LinkedHashMap<String, Set<String>>()
            researchRuleFiles.sort().each { path ->
                def rule = parsePackagedJson(path)
                def target = rule['target']
                def blueprints = target instanceof Map ? target['blueprints'] : null
                if (!(blueprints instanceof List) || blueprints.isEmpty()
                        || target.keySet() != (['blueprints'] as Set)
                        || !blueprints.every { it instanceof String && !it.isBlank() }) {
                    throw new GradleException(
                            "Packaged default-tree rule must use a nonempty exact blueprint target: ${path}")
                }
                def prerequisites = rule.containsKey('prerequisites')
                        ? rule['prerequisites'] : []
                if (rule['visibility'] != 'full'
                        || rule['tree_enabled'] != true
                        || rule['research_enabled'] == false
                        || rule['requires_discovery'] == true
                        || !(rule['research_cost'] instanceof Map)
                        || !(rule['research_cost']['points'] in [2, 4, 6, 8, 10, 12])) {
                    throw new GradleException(
                            "Packaged default-tree rules must be full, selectable, and tier-costed: ${path}")
                }
                if (!(prerequisites instanceof List)
                        || !prerequisites.every { it instanceof String && !it.isBlank() }) {
                    throw new GradleException(
                            "Packaged default-tree rule has invalid prerequisites: ${path}")
                }
                blueprints.each { blueprint ->
                    if (prerequisitesByTarget.put(blueprint, new LinkedHashSet<>(prerequisites)) != null) {
                        throw new GradleException(
                                "Packaged default-tree blueprint is targeted more than once: ${blueprint}")
                    }
                }
            }
            if (prerequisitesByTarget.size() != 172) {
                throw new GradleException(
                        "Expected the packaged default policies to cover 172 recipe-backed TaCZ blueprints, found "
                                + prerequisitesByTarget.size())
            }
            def unknownPrerequisites = prerequisitesByTarget.values().flatten().findAll {
                !prerequisitesByTarget.containsKey(it)
            }.toSet()
            if (!unknownPrerequisites.isEmpty()) {
                throw new GradleException(
                        "Packaged default tree references unknown prerequisites: ${unknownPrerequisites}")
            }
            if (exactTechPlacements.keySet() != prerequisitesByTarget.keySet()) {
                def missingPlacements = new LinkedHashSet<String>(prerequisitesByTarget.keySet())
                missingPlacements.removeAll(exactTechPlacements.keySet())
                def placementsWithoutRules = new LinkedHashSet<String>(exactTechPlacements.keySet())
                placementsWithoutRules.removeAll(prerequisitesByTarget.keySet())
                throw new GradleException(
                        'Packaged Research Tech Tree placements and research rules differ; '
                                + "missing placements ${missingPlacements}, placements without rules ${placementsWithoutRules}")
            }
            def tierOrdinal = expectedTechTiers.withIndex().collectEntries { tier, index ->
                [(tier): index]
            }
            def expectedTechRoots = [
                    weapons: 'tacz:glock_17',
                    attachments: 'tacz:grip_rk6',
                    ammo: 'tacz:9mm'
            ]
            expectedTechDomains.each { domain ->
                def domainTargets = exactTechPlacements.findAll { ignored, placement ->
                    placement.domain == domain
                }.keySet()
                if (domain == 'weapons') {
                    return
                }
                def domainRoots = domainTargets.findAll { target ->
                    prerequisitesByTarget[target].isEmpty()
                } as Set
                if (domainRoots != ([expectedTechRoots[domain]] as Set)) {
                    throw new GradleException(
                            "Packaged ${domain} Tech Tree must have only ${expectedTechRoots[domain]} as its root, found ${domainRoots}")
                }
                domainTargets.each { target ->
                    def targetPlacement = exactTechPlacements[target]
                    prerequisitesByTarget[target].each { prerequisite ->
                        def prerequisitePlacement = exactTechPlacements[prerequisite]
                        if (prerequisitePlacement.domain != domain) {
                            throw new GradleException(
                                    "Packaged ${domain} Tech Tree has a cross-domain prerequisite: ${prerequisite} -> ${target}")
                        }
                        int prerequisiteTier = tierOrdinal[prerequisitePlacement.tier]
                        int targetTier = tierOrdinal[targetPlacement.tier]
                        boolean movesBackward = targetTier < prerequisiteTier
                                || targetTier == prerequisiteTier
                                && targetPlacement.order <= prerequisitePlacement.order
                        if (movesBackward) {
                            throw new GradleException(
                                    "Packaged ${domain} Tech Tree prerequisite moves backward: ${prerequisite} -> ${target}")
                        }
                    }
                }
                def reachable = new LinkedHashSet<String>(domainRoots)
                boolean expanded
                do {
                    expanded = false
                    domainTargets.each { target ->
                        if (!reachable.contains(target)
                                && reachable.containsAll(prerequisitesByTarget[target])
                                && reachable.add(target)) {
                            expanded = true
                        }
                    }
                } while (expanded)
                if (reachable != domainTargets) {
                    def unreachable = new LinkedHashSet<String>(domainTargets)
                    unreachable.removeAll(reachable)
                    throw new GradleException(
                            "Packaged ${domain} Tech Tree is not fully reachable: ${unreachable}")
                }
            }
            def weaponRanks = exactTechPlacements.findAll { ignored, placement ->
                placement.domain == 'weapons'
            }.values().collect { it.rank as int }
            def occupiedWeaponRanks = weaponRanks.toSet().toList().sort()
            def expectedWeaponRanks = (0..occupiedWeaponRanks.last()).toList()
            def maximumWeaponRankPopulation = weaponRanks.countBy { it }.values().max()
            if (occupiedWeaponRanks != expectedWeaponRanks
                    || maximumWeaponRankPopulation > packagedTechTree['layout']['min_nodes_per_layer']) {
                throw new GradleException(
                        'Packaged weapon ranks must be contiguous and fit the format-2 layer cap; '
                                + "ranks=${occupiedWeaponRanks}, maximum population=${maximumWeaponRankPopulation}")
            }
            def weaponTopologyManifest = exactTechPlacements.findAll { ignored, placement ->
                placement.domain == 'weapons'
            }.keySet().toList().sort().collect { blueprint ->
                def prerequisites = prerequisitesByTarget[blueprint].toList().sort().join(',')
                "${blueprint}|${exactTechPlacements[blueprint].rank}|${prerequisites}\n"
            }.join('')
            def weaponTopologyFingerprint = java.security.MessageDigest
                    .getInstance('SHA-256')
                    .digest(weaponTopologyManifest.getBytes('UTF-8'))
                    .encodeHex().toString()
            if (weaponTopologyFingerprint
                    != 'b46b32443ea564e7509d1ea01e6d75ab5a97f9ef49702ea0ca830aae6856ad4f') {
                throw new GradleException(
                        'Packaged emergency weapon-fallback topology changed without updating its fingerprint: '
                                + weaponTopologyFingerprint)
            }
            def groupedTargets = new LinkedHashSet<String>()
            researchGroupFiles.sort().each { path ->
                def group = parsePackagedJson(path)
                if (group.containsKey('include_in_overview') && group['include_in_overview'] != true) {
                    throw new GradleException(
                            "Packaged default group must be included in All Weapons: ${path}")
                }
                def ranks = group['ranks']
                if (!(ranks instanceof List) || !ranks.every { it instanceof List }) {
                    throw new GradleException("Packaged default group has invalid ranks: ${path}")
                }
                ranks.flatten().each { member ->
                    if (!(member instanceof String) || member.isBlank()) {
                        throw new GradleException(
                                "Packaged default group has an invalid member: ${path}")
                    }
                    if (!groupedTargets.add(member)) {
                        throw new GradleException(
                                "Packaged default group member appears more than once: ${member}")
                    }
                }
            }
