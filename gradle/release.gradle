// NeoForge uses Mojang names in production. There is no Forge SRG reobfuscation/refmap gate.
def digest = { File file -> MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString() }
def reportDirectory = layout.buildDirectory.dir('reports/release')
def writeReport = { String name, Map value ->
    def destination = new File(reportDirectory.get().asFile, name)
    destination.parentFile.mkdirs()
    destination.text = JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n'
}
