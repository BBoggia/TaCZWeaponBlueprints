tasks.register('generateResearchTechTreeRatings', JavaExec) {
    group = 'authoring'
    description = 'Extracts TaCZ gun-pack evidence and writes non-authoritative Tech Tree rating suggestions.'
    dependsOn tasks.named('authoringClasses')
    classpath = sourceSets.authoring.runtimeClasspath
    mainClass = 'com.gamergaming.taczweaponblueprints.research.tree.authoring.ResearchTechTreeRatingTool'

    def gunPack = providers.gradleProperty('researchGunPack')
            .orElse(layout.projectDirectory.dir('run/tacz/tacz_default_gun').asFile.absolutePath)
    def report = providers.gradleProperty('researchRatingReport')
            .orElse(layout.buildDirectory.file('reports/research-tech-tree/tacz-weapon-ratings.json')
                    .map { it.asFile.absolutePath })
    def appeal = providers.gradleProperty('researchAppealRatings')
            .orElse(layout.projectDirectory
                    .file('src/authoring/resources/tacz-1.1.8-appeal-ratings.json')
                    .asFile.absolutePath)
    def sourceVersion = providers.gradleProperty('researchGunPackVersion').orElse(tacz_version)
    def expectedGunCount = providers.gradleProperty('researchExpectedGunCount').orElse('53')

    inputs.dir(gunPack).withPropertyName('gunPackContents')
    inputs.property('gunPackPath', gunPack)
    inputs.property('sourceVersion', sourceVersion)
    inputs.property('expectedGunCount', expectedGunCount)
    inputs.files(appeal).withPropertyName('appealRatingsFile').optional()
    outputs.file(report)

    doFirst {
        args = [
                '--pack', gunPack.get(),
                '--output', report.get(),
                '--source-version', sourceVersion.get(),
                '--expected-count', expectedGunCount.get()
        ]
        args += ['--appeal', appeal.get()]
    }
}

tasks.register('generateAutomaticWeaponReference', JavaExec) {
    group = 'authoring'
    description = 'Regenerates the checked-in TaCZ 1.1.8 mechanical reference catalog.'
    dependsOn tasks.named('authoringClasses')
    classpath = sourceSets.authoring.runtimeClasspath
    mainClass = 'com.gamergaming.taczweaponblueprints.research.tree.authoring.ResearchAutomaticReferenceTool'

    def gunPack = providers.gradleProperty('researchGunPack')
            .orElse(layout.projectDirectory.dir('run/tacz/tacz_default_gun').asFile.absolutePath)
    def output = providers.gradleProperty('researchAutomaticReference')
            .orElse(layout.projectDirectory.file(
                    'src/main/resources/assets/taczweaponblueprints/research/automatic/'
                            + 'tacz-1.1.8-mechanical-v2.json').asFile.absolutePath)
    def sourceVersion = providers.gradleProperty('researchGunPackVersion').orElse(tacz_version)
    def expectedGunCount = providers.gradleProperty('researchExpectedGunCount').orElse('53')

    inputs.dir(gunPack).withPropertyName('gunPackContents')
    inputs.property('gunPackPath', gunPack)
    inputs.property('sourceVersion', sourceVersion)
    inputs.property('expectedGunCount', expectedGunCount)
    outputs.file(output)

    doFirst {
        args = [
                '--pack', gunPack.get(),
                '--output', output.get(),
                '--source-version', sourceVersion.get(),
                '--expected-count', expectedGunCount.get()
        ]
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            tacz_version_range     : tacz_version_range,
            fzzy_config_version_range: fzzy_config_version_range,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    dependsOn ':compileJava'
    from("$buildDir/classes/java/main") {
        include "${mod_id}.refmap.json"
        into 'META-INF'
    }
}

tasks.named('jar', Jar).configure {
    preserveFileTimestamps = false
    reproducibleFileOrder = true

    from('LICENSE.txt') {
        into ''
    }

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Automatic-Placement-Version': certifiedAutomaticPlacementVersion,
                'Research-Tree-Protocol'  : certifiedResearchTreeProtocol,
                'Research-Catalog-Export-Format':
                        certifiedResearchCatalogExportFormat.toString(),
                'Automatic-Publication-Contract':
                        certifiedAutomaticPublicationContract,
                'Automatic-Publication-Health':
                        certifiedAutomaticPublicationHealthContract,

                // Add this line to specify your Mixin config file
                'MixinConfigs'            : "${mod_id}.mixins.json",
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.register('verifySharedLayoutKernelMigration') {
    group = 'verification'
    description = 'Rejects production regressions to the compatibility-only Research Tree layout engines.'
    dependsOn tasks.named('compileJava')

    def productionSources = fileTree('src/main/java') {
        include '**/*.java'
    }
    inputs.files(productionSources)
    inputs.dir(layout.buildDirectory.dir('classes/java/main'))

    doLast {
        def jdepsName = System.getProperty('os.name')
                .toLowerCase(java.util.Locale.ROOT).contains('windows')
                ? 'jdeps.exe' : 'jdeps'
        def jdepsExecutable = new File(System.getProperty('java.home'), "bin/${jdepsName}")
        if (!jdepsExecutable.isFile()) {
            throw new GradleException("JDK dependency analyzer does not exist: ${jdepsExecutable}")
        }
        def dependencyOutput = new ByteArrayOutputStream()
        def dependencyErrors = new ByteArrayOutputStream()
        def dependencyResult = exec {
            commandLine jdepsExecutable.absolutePath,
                    '--ignore-missing-deps',
                    '-verbose:class',
                    layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath
            standardOutput = dependencyOutput
            errorOutput = dependencyErrors
            ignoreExitValue = true
        }
        if (dependencyResult.exitValue != 0) {
            throw new GradleException(
                    'Could not inspect compiled Research Tree dependencies: '
                            + dependencyErrors.toString('UTF-8'))
        }
        def compiledDependencies = new LinkedHashMap<String, Set<String>>()
        dependencyOutput.toString('UTF-8').eachLine { line ->
            def match = line =~ /^\s*(\S+)\s+->\s+(\S+)\s+.*$/
            if (match.matches()) {
                compiledDependencies.computeIfAbsent(match.group(1)) {
                    new LinkedHashSet<String>()
                }.add(match.group(2))
            }
        }

        def legacyClasses = [
                'com.gamergaming.taczweaponblueprints.research.tree.ResearchTreeLayoutEngine',
                'com.gamergaming.taczweaponblueprints.research.tree.ResearchTreeGroupedLayoutEngine'
        ] as Set
        def legacyReferences = compiledDependencies.collectMany { source, dependencies ->
            legacyClasses.contains(source)
                    ? []
                    : dependencies.findAll { legacyClasses.contains(it) }.collect {
                        "${source} -> ${it}"
                    }
        }.sort()
        if (!legacyReferences.isEmpty()) {
            throw new GradleException(
                    'Production code references a compatibility-only Research Tree layout engine: '
                            + legacyReferences)
        }

        def requiredSources = [
                'src/main/java/com/gamergaming/taczweaponblueprints/client/ResearchTreeProjectionCache.java',
                'src/main/java/com/gamergaming/taczweaponblueprints/client/ResearchTreeRecommendationEngine.java',
                'src/main/java/com/gamergaming/taczweaponblueprints/client/ResearchTreePlanner.java',
                'src/main/java/com/gamergaming/taczweaponblueprints/client/ClientResearchPlannerState.java',
                'src/main/java/com/gamergaming/taczweaponblueprints/client/ResearchTechTreeDomainSelectorLayout.java',
                'src/main/java/com/gamergaming/taczweaponblueprints/client/ResearchTechTreeDomainMenu.java',
                'src/main/java/com/gamergaming/taczweaponblueprints/compat/fzzy_config/ResearchTreeClientConfig.java',
                'src/main/java/com/gamergaming/taczweaponblueprints/research/tree/ResearchTreeBranchLayoutComposer.java',
                'src/main/java/com/gamergaming/taczweaponblueprints/research/tree/ResearchTreeGroupSkeletonBuilder.java',
                'src/main/java/com/gamergaming/taczweaponblueprints/research/tree/ResearchTreeGroupSkeletonCatalog.java',
                'src/main/java/com/gamergaming/taczweaponblueprints/research/tree/ResearchTreeLayeredLayoutEngine.java',
                'src/main/java/com/gamergaming/taczweaponblueprints/research/tree/ResearchTreeLayoutPolicy.java',
                'src/main/java/com/gamergaming/taczweaponblueprints/research/tree/ResearchTreeOverviewLayoutComposer.java'
        ]
        def missingSources = requiredSources.findAll { !file(it).isFile() }
        if (!missingSources.isEmpty()) {
            throw new GradleException(
                    "Shared Research Tree layout kernel is incomplete: ${missingSources}")
        }

        def projectionCacheClass =
                'com.gamergaming.taczweaponblueprints.client.ResearchTreeProjectionCache'
        def requiredCacheComponents = [
                'com.gamergaming.taczweaponblueprints.research.tree.ResearchTreeGroupSkeletonBuilder',
                'com.gamergaming.taczweaponblueprints.research.tree.ResearchTreeOverviewLayoutComposer',
                'com.gamergaming.taczweaponblueprints.research.tree.ResearchTreeBranchLayoutComposer',
                'com.gamergaming.taczweaponblueprints.research.tree.ResearchTreeLayoutPolicy'
        ] as Set
        def projectionCacheDependencies = compiledDependencies.getOrDefault(
                projectionCacheClass, [] as Set)
        def missingCacheComponents = requiredCacheComponents.findAll {
            !projectionCacheDependencies.contains(it)
        }
        if (!missingCacheComponents.isEmpty()) {
            throw new GradleException(
                    'The runtime Research Tree projection cache is not wired to the complete shared kernel: '
                            + missingCacheComponents)
        }

        def techLayoutClass =
                'com.gamergaming.taczweaponblueprints.client.ResearchTechTreeLayoutEngine'
        def requiredTechComponents = [
                'com.gamergaming.taczweaponblueprints.research.tree.ResearchTreeLayeredLayoutEngine',
                'com.gamergaming.taczweaponblueprints.research.tree.ResearchTreeLayoutInput',
                'com.gamergaming.taczweaponblueprints.research.tree.ResearchTreeLayoutPolicy'
        ] as Set
        def techLayoutDependencies = compiledDependencies.getOrDefault(
                techLayoutClass, [] as Set)
        def missingTechComponents = requiredTechComponents.findAll {
            !techLayoutDependencies.contains(it)
        }
        if (!missingTechComponents.isEmpty()) {
            throw new GradleException(
                    'Research Tech Tree domains are not wired to the shared layered kernel: '
                            + missingTechComponents)
        }

        // jdeps intentionally suppresses same-package dependencies. Pin these
        // screen-level integrations at source and require the selector class in
        // the packaged-artifact gate below.
        def benchScreenSource = file(
                'src/main/java/com/gamergaming/taczweaponblueprints/client/ResearchBenchScreen.java')
                .getText('UTF-8')
        def missingTechUiComponents = [
                'ResearchTechTreeDomainSelectorLayout.forBounds',
                'ResearchTechTreeDomainMenu.create',
                'ResearchTechTreeViewState techTreeNavigation',
                'ResearchTreeRecommendationEngine.recommend',
                'ResearchTreePlanner.plan',
                'ClientResearchPlannerState.track',
                'treeCanvas.setTrackedPlan'
        ].findAll { !benchScreenSource.contains(it) }
        if (!missingTechUiComponents.isEmpty()) {
            throw new GradleException(
                    'The Research Bench no longer exposes the stateful Tech Tree domain selector: '
                            + missingTechUiComponents)
        }

        def configRegistration = file(
                'src/main/java/com/gamergaming/taczweaponblueprints/init/ModConfigs.java')
                .getText('UTF-8')
        if (!(configRegistration =~ /ResearchTreeClientConfig\s+RESEARCH_TREE_CLIENT\s*=\s*\R\s*register\(ResearchTreeClientConfig::new,\s*RegisterType\.CLIENT\)/).find()) {
            throw new GradleException(
                    'Research Tree layout policy must remain registered as a client-only config')
        }
    }
}

