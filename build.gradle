plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-${minecraft_version}-neoforge"
// Keep clean/build and development runs away from the preserved Forge artifacts.
layout.buildDirectory = layout.projectDirectory.dir('build/neoforge')

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
        exclude '.cache/**', '**/.DS_Store'
    }
    authoring {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    development {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    // A separate setup probe, never part of the addon JAR or normal game runs.
    portBootstrap
    // Gradle lifecycle regressions run without a Minecraft bootstrap or a game installation.
    buildVerification
    portVerification {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.authoring.output + sourceSets.development.output
        runtimeClasspath += sourceSets.authoring.output + sourceSets.development.output
    }
}

configurations {
    verificationViewers
    authoringImplementation.extendsFrom implementation
    authoringCompileOnly.extendsFrom compileOnly
    authoringRuntimeOnly.extendsFrom runtimeOnly
    developmentImplementation.extendsFrom implementation
    developmentCompileOnly.extendsFrom compileOnly
    developmentRuntimeOnly.extendsFrom runtimeOnly
    portVerificationImplementation.extendsFrom implementation
    portVerificationCompileOnly.extendsFrom compileOnly
    portVerificationRuntimeOnly.extendsFrom runtimeOnly
    portBootstrapImplementation.extendsFrom implementation
    portBootstrapRuntimeOnly.extendsFrom runtimeOnly
    testCompileOnly.extendsFrom compileOnly
}

def preparePortBootstrapClientOptions = tasks.register('preparePortBootstrapClientOptions') {
    group = 'build setup'
    description = 'Skips first-launch onboarding in a fresh, unattended dependency-check client.'
    onlyIf { providers.gradleProperty('portBootstrapAutoStop').orElse('false').get().toBoolean() }
    doLast {
        def options = file('run/neoforge/bootstrap-client/options.txt')
        if (!options.exists()) {
            options.parentFile.mkdirs()
            options.text = 'onboardAccessibility:false\n'
        }
    }
}

neoForge {
    version = neo_version
    addModdingDependenciesTo sourceSets.authoring
    addModdingDependenciesTo sourceSets.development
    addModdingDependenciesTo sourceSets.portBootstrap
    addModdingDependenciesTo sourceSets.portVerification
    // These tests inspect untransformed mixin classes as well as pure domain code.
    // Actual mixin application is checked by the separate game verification runs.
    addModdingDependenciesTo sourceSets.test
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
        wrb_port_bootstrap { sourceSet sourceSets.portBootstrap }
        wrb_core_verification { sourceSet sourceSets.portVerification }
    }
    runs {
        configureEach {
            loadedMods = [mods[mod_id]]
            systemProperty 'forge.logging.console.level', 'info'
        }
        client {
            client()
            gameDirectory = file('run/neoforge/client')
        }
        server {
            server()
            gameDirectory = file('run/neoforge/server')
            programArgument '--nogui'
        }
        data {
            data()
            gameDirectory = file('run/neoforge/data')
            programArguments.addAll '--mod', mod_id, '--all', '--output',
                    file('src/generated/resources').absolutePath, '--existing',
                    file('src/main/resources').absolutePath
        }
        portBootstrapClient {
            client()
            taskBefore preparePortBootstrapClientOptions
            sourceSet = sourceSets.portBootstrap
            loadedMods = [mods.wrb_port_bootstrap]
            gameDirectory = file('run/neoforge/bootstrap-client')
            systemProperty 'wrb.portBootstrap.exitAfterReady',
                    providers.gradleProperty('portBootstrapAutoStop').orElse('false').get()
        }
        portBootstrapServer {
            server()
            sourceSet = sourceSets.portBootstrap
            loadedMods = [mods.wrb_port_bootstrap]
            gameDirectory = file('run/neoforge/bootstrap-server')
            systemProperty 'wrb.portBootstrap.exitAfterReady',
                    providers.gradleProperty('portBootstrapAutoStop').orElse('false').get()
            programArgument '--nogui'
        }
    }
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'EMI'
        url = 'https://maven.terraformersmc.com/'
        content { includeGroup 'dev.emi' }
    }
}

def recipeViewer = providers.gradleProperty('recipeViewer').orElse('none').get()
if (!(recipeViewer in ['none', 'emi', 'jei'])) {
    throw new GradleException('recipeViewer must be none, emi, or jei.')
}
if (providers.gradleProperty('includeStructureDataMods').orElse('false').get().toBoolean()) {
    throw new GradleException('The Forge structure-mod datagen profile has not been ported to NeoForge.')
}

dependencies {
    // Immutable Modrinth version IDs identify the NeoForge files unambiguously.
    implementation "maven.modrinth:${tacz_project_id}:${tacz_version_id}"
    implementation "maven.modrinth:fzzy-config:${fzzy_config_version_id}"
    implementation "thedarkcolour:kotlinforforge-neoforge:${kotlin_for_forge_version}"
    // TaCZ's published JAR supplies this module at runtime. Adding it to the
    // launch classpath again causes a duplicate JPMS module on both sides.
    compileOnly 'org.apache.commons:commons-math3:3.6.1'
    // Standalone authoring tools do not use the game loader's TaCZ jar-in-jar libraries.
    authoringRuntimeOnly 'org.apache.commons:commons-math3:3.6.1'
    compileOnly 'net.peanuuutz.tomlkt:tomlkt-jvm:0.3.7'

    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (recipeViewer == 'emi') runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
    if (recipeViewer == 'jei') runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    verificationViewers "dev.emi:emi-neoforge:${emi_version}"
    verificationViewers "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.apache.commons:commons-math3:3.6.1'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.10.2'
    testRuntimeOnly 'blue.endless:jankson:1.2.3'
    testRuntimeOnly 'io.github.llamalad7:mixinextras-neoforge:0.5.3'
    testRuntimeOnly 'net.peanuuutz.tomlkt:tomlkt-jvm:0.3.7'
    buildVerificationImplementation gradleTestKit()
    buildVerificationImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    buildVerificationRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

def metadataProperties = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_group_id: mod_group_id, mod_authors: mod_authors,
        mod_license: mod_license, mod_description: mod_description,
        minecraft_version_range: minecraft_version_range,
        neo_version_range: neo_version_range, loader_version_range: loader_version_range,
        tacz_version_range: tacz_version_range,
        fzzy_config_version_range: fzzy_config_version_range
]
tasks.withType(ProcessResources).configureEach {
    inputs.properties metadataProperties
    filteringCharset = 'UTF-8'
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand metadataProperties
    }
    exclude '**/.DS_Store'
}

apply from: 'gradle/versioning.gradle'
apply from: 'gradle/authoring.gradle'
tasks.named('jar', Jar) {
    dependsOn tasks.named('verifyVersionState')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from 'LICENSE.txt'
    manifest.attributes 'Implementation-Title': mod_name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': mod_authors
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.register('testReleaseGates', Test) {
    group = 'verification'
    description = 'Exercises release evidence checks in isolated Gradle builds.'
    testClassesDirs = sourceSets.buildVerification.output.classesDirs
    classpath = sourceSets.buildVerification.runtimeClasspath
    useJUnitPlatform()
    inputs.file('gradle/release-evidence.gradle')
    systemProperty 'wrb.releaseEvidenceScript', file('gradle/release-evidence.gradle').absolutePath
    systemProperty 'wrb.fixtureTestClasspath', configurations.buildVerificationRuntimeClasspath.asPath
    systemProperty 'wrb.testKitDirectory', layout.buildDirectory.dir('test-kit').get().asFile.absolutePath
}
tasks.named('check') { dependsOn tasks.named('verifyVersionState') }
// ModDevGradle launches otherwise inherit an empty input stream.
tasks.named('runServer', JavaExec) { standardInput = System.in }
tasks.named('runPortBootstrapServer', JavaExec) { standardInput = System.in }

tasks.register('verifyPortDependencies') {
    group = 'verification'
    description = 'Resolves the NeoForge compile and setup runtime dependencies without compiling the addon.'
    doLast {
        [configurations.compileClasspath, configurations.portBootstrapRuntimeClasspath].each { config ->
            def artifacts = config.resolvedConfiguration.resolvedArtifacts
            artifacts.each { artifact ->
                if (!artifact.file.isFile()) {
                    throw new GradleException("Missing dependency artifact: ${artifact.id}")
                }
            }
            logger.lifecycle('{}: {} resolved artifacts', config.name, artifacts.size())
        }
    }
}

apply from: 'gradle/release.gradle'

// Full-addon startup checks: unlike the dependency probe, these load production sources.
neoForge.runs {
    coreClient {
        client()
        sourceSet = sourceSets.portBootstrap
        loadedMods = [neoForge.mods[mod_id], neoForge.mods.wrb_port_bootstrap]
        gameDirectory = file('run/neoforge/core-client')
        systemProperty 'wrb.portBootstrap.exitAfterReady', 'true'
    }
    coreServer {
        server()
        sourceSet = sourceSets.portBootstrap
        loadedMods = [neoForge.mods[mod_id], neoForge.mods.wrb_port_bootstrap]
        gameDirectory = file('run/neoforge/core-server')
        systemProperty 'wrb.portBootstrap.exitAfterReady', 'true'
        programArgument '--nogui'
    }
}

neoForge.runs {
    verifyCoreServer {
        server()
        sourceSet = sourceSets.portVerification
        loadedMods = [neoForge.mods[mod_id], neoForge.mods.wrb_core_verification]
        gameDirectory = file('run/neoforge/verification-server')
        programArgument '--nogui'
    }
    verifyCoreClient {
        client()
        sourceSet = sourceSets.portVerification
        loadedMods = [neoForge.mods[mod_id], neoForge.mods.wrb_core_verification]
        gameDirectory = file('run/neoforge/verification-client')
        programArguments.addAll '--username', 'WRBCoreQA'
    }
}

// A failed launch must not leave a previous successful report looking current.
if (providers.gradleProperty('portReviewChecks').orElse('false').get().toBoolean()
        && providers.gradleProperty('portFeatureChecks').orElse('false').get().toBoolean()) {
    throw new GradleException('Choose either portReviewChecks or portFeatureChecks, not both.')
}
['Server', 'Client'].each { side ->
    tasks.named("runVerifyCore${side}", JavaExec) {
        systemProperty 'wrb.verifyReviewFixes', providers.gradleProperty('portReviewChecks').orElse('false').get()
        systemProperty 'wrb.verifyFeatures', providers.gradleProperty('portFeatureChecks').orElse('false').get()
        doFirst {
            delete file("run/neoforge/verification-${side.toLowerCase(Locale.ROOT)}/core-verification.json")
            if (providers.gradleProperty('portFeatureChecks').orElse('false').get().toBoolean()) {
                delete(fileTree("run/neoforge/verification-${side.toLowerCase(Locale.ROOT)}") {
                    include 'feature-*.png', 'feature-catalog.json', 'feature-datapack.zip'
                })
            }
            if (providers.gradleProperty('portReviewChecks').orElse('false').get().toBoolean()) {
                def directory = file("run/neoforge/verification-${side.toLowerCase(Locale.ROOT)}")
                if (side == 'Server') {
                    delete(['review-datapack.zip', 'review-project.zip', 'review-export.json', 'review-INSTALL.txt']
                            .collect { new File(directory, it) })
                } else {
                    delete(fileTree(directory) { include 'review-*.png' })
                }
            }
        }
    }
}
