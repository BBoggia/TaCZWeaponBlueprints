                    'recipe_viewer.taczweaponblueprints.research_data.2'
            ]
            def authoredTechTreeLanguageKeys = [packagedTechTree['translation_key']]
            authoredTechTreeLanguageKeys.addAll(
                    (packagedTechTree['tiers'] ?: []).collect { it['translation_key'] })
            packagedTechTree['domains'].each { domain ->
                authoredTechTreeLanguageKeys.add(domain['translation_key'])
                authoredTechTreeLanguageKeys.addAll(
                        domain['lanes'].collect { it['translation_key'] })
            }
            requiredResearchTreeLanguageKeys.addAll(
                    authoredTechTreeLanguageKeys.findAll {
                        it instanceof String && !it.isBlank()
                    })
            def missingResearchTreeLanguageKeys = requiredResearchTreeLanguageKeys.findAll {
                !language.containsKey(it) || !(language[it] instanceof String) || language[it].isBlank()
            }
            if (!missingResearchTreeLanguageKeys.isEmpty()) {
                throw new GradleException(
                        "Packaged Research Tree localization is incomplete: ${missingResearchTreeLanguageKeys}")
            }

            def mixinEntry = zip.getEntry('taczweaponblueprints.mixins.json')
            def mixinConfig = zip.getInputStream(mixinEntry).withCloseable { stream ->
                jsonParser.parse(stream, 'UTF-8')
            }
            def expectedCommonMixins = [
                    'IGunSmithTableRecipeAccessor',
                    'GunSmithTableMenuMixin',
                    'TaCZLootTableInjectorModifierMixin'
            ] as Set
            if (!(mixinConfig.mixins instanceof List)
                    || mixinConfig.mixins.toSet() != expectedCommonMixins) {
                throw new GradleException(
                        "Packaged common mixin surface does not match ${expectedCommonMixins}")
            }
            def expectedClientMixins = [
                    'EmiScreenBaseMixin',
                    'GunSmithTableScreenMixin',
                    'ICreativeModeTabsAccessor',
                    'IAbstractContainerScreenAccessor'
            ] as Set
            if (!(mixinConfig.client instanceof List) || mixinConfig.client.toSet() != expectedClientMixins) {
                throw new GradleException("Packaged client mixin surface does not match ${expectedClientMixins}")
            }
            def refmapEntry = zip.getEntry('META-INF/taczweaponblueprints.refmap.json')
            if (refmapEntry == null) {
                throw new GradleException('Packaged Mixin refmap is missing')
            }
            def refmapText = zip.getInputStream(refmapEntry).getText('UTF-8')
            if (!refmapText.contains(
                    'Lnet/minecraft/world/item/ItemStack;copy()Lnet/minecraft/world/item/ItemStack;')
                    || !refmapText.contains(
                    'Lnet/minecraft/world/item/ItemStack;m_41777_()Lnet/minecraft/world/item/ItemStack;')) {
                throw new GradleException(
                        'Packaged crafted-gun mixin refmap does not remap ItemStack.copy')
            }

            def globalEntry = zip.getEntry('data/forge/loot_modifiers/global_loot_modifiers.json')
            def globalIndex = zip.getInputStream(globalEntry).withCloseable { stream ->
                jsonParser.parse(stream, 'UTF-8')
            }
            if (!(globalIndex.entries instanceof List) || globalIndex.entries.size() != 494) {
                throw new GradleException('Packaged global loot-modifier index must contain exactly 494 entries')
            }
            if (globalIndex.entries.toSet().size() != globalIndex.entries.size()) {
                throw new GradleException('Packaged global loot-modifier index contains duplicate entries')
            }
            def expectedModifierIds = modifierFiles.collect {
                'taczweaponblueprints:' + it.substring('data/taczweaponblueprints/loot_modifiers/'.length(), it.length() - '.json'.length())
            }.toSet()
            if (globalIndex.entries.toSet() != expectedModifierIds) {
                throw new GradleException('Packaged global loot-modifier index does not match modifier files')
            }

            def modsToml = zip.getInputStream(zip.getEntry('META-INF/mods.toml')).getText('UTF-8')
            if (!modsToml.contains('loaderVersion="' + loader_version_range + '"')) {
                throw new GradleException("Packaged metadata does not declare FML ${loader_version_range}")
            }
            if (!modsToml.contains('versionRange="' + minecraft_version_range + '"')) {
                throw new GradleException("Packaged metadata does not declare Minecraft ${minecraft_version_range}")
            }
            if (!modsToml.contains('versionRange="' + forge_version_range + '"')) {
                throw new GradleException("Packaged metadata does not declare Forge ${forge_version_range}")
            }
            if (!modsToml.contains('versionRange="' + tacz_version_range + '"')) {
                throw new GradleException("Packaged metadata does not declare TaCZ ${tacz_version_range}")
            }
            if (!modsToml.contains('versionRange="' + fzzy_config_version_range + '"')) {
                throw new GradleException("Packaged metadata does not declare Fzzy Config ${fzzy_config_version_range}")
            }
            if (!modsToml.contains('issueTrackerURL="https://github.com/BBoggia/TaCZWeaponBlueprints/issues"')) {
                throw new GradleException('Packaged metadata does not declare the project issue tracker')
            }
            if (!modsToml.contains('displayURL="https://github.com/BBoggia/TaCZWeaponBlueprints"')) {
                throw new GradleException('Packaged metadata does not declare the project homepage')
            }
            if (modsToml.contains('change.me') || modsToml.contains('example.invalid')
                    || modsToml.contains('examplemod')) {
                throw new GradleException('Packaged metadata contains Forge MDK placeholder values')
            }

            def manifest = zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')).withCloseable { stream ->
                new java.util.jar.Manifest(stream)
            }
            def attributes = manifest.mainAttributes
            if (attributes.getValue('Implementation-Version') != project.version.toString()) {
                throw new GradleException('Manifest implementation version does not match the project version')
            }
            if (attributes.getValue('Automatic-Placement-Version')
                            != certifiedAutomaticPlacementVersion
                    || attributes.getValue('Research-Tree-Protocol')
                            != certifiedResearchTreeProtocol
                    || attributes.getValue('Research-Catalog-Export-Format')
                            != certifiedResearchCatalogExportFormat.toString()
                    || attributes.getValue('Automatic-Prerequisite-Strategy')
                            != certifiedAutomaticPrerequisiteStrategy
                    || attributes.getValue('Automatic-Scoring-Model')
                            != certifiedAutomaticScoringModel
                    || attributes.getValue('Automatic-Scoring-Formula')
                            != certifiedAutomaticFormulaVersion
                    || attributes.getValue('Automatic-Scoring-Reference')
                            != certifiedAutomaticReferenceVersion
                    || attributes.getValue('Grouped-Route-Quality')
                            != certifiedGroupedRouteQualityContract
                    || attributes.getValue('Grouped-Route-Motif-Decision')
                            != certifiedGroupedRouteMotifDecisionContract
                    || attributes.getValue('Grouped-Prerequisite-Acceptance')
                            != certifiedGroupedPrerequisiteAcceptanceContract
                    || attributes.getValue('Grouped-Route-Rollout')
                            != certifiedGroupedRouteRolloutContract
                    || attributes.getValue('Grouped-Route-Selection')
                            != certifiedGroupedRouteSelectionContract
                    || attributes.getValue('Grouped-Route-Stabilization')
                            != certifiedGroupedRouteStabilizationContract
                    || attributes.getValue('Hybrid-Route-Generation')
                            != certifiedHybridRouteGenerationContract
                    || attributes.getValue('Grouped-Visual-Refinement')
                            != certifiedGroupedVisualRefinementContract
                    || attributes.getValue('Automatic-Publication-Contract')
                            != certifiedAutomaticPublicationContract
                    || attributes.getValue('Automatic-Publication-Health')
                            != certifiedAutomaticPublicationHealthContract) {
                throw new GradleException(
                        'Packaged manifest does not match the certified Research Tree contracts')
            }
            if (attributes.getValue('Implementation-Timestamp') != null) {
                throw new GradleException('Manifest contains a non-reproducible implementation timestamp')
            }
        } finally {
            zip.close()
        }
    }
}

apply from: 'gradle/versioning.gradle'

tasks.named('check').configure {
    dependsOn tasks.named('verifyReleaseArtifact')
    dependsOn tasks.named('verifyVersionState')
}

tasks.register('verifyPublicationReadiness') {
    group = 'verification'
    description = 'Runs artifact verification and blocks publication while legal/release choices remain unresolved.'
    dependsOn tasks.named('verifyReleaseArtifact')

    doLast {
        def changelogText = file('CHANGELOG.md').getText('UTF-8')
        def changelogLines = changelogText.readLines()
        def unreleasedIndex = changelogLines.findIndexOf { it.trim() == '## Unreleased' }
        if (unreleasedIndex < 0) {
            throw new GradleException(
                    'Publication is blocked: CHANGELOG.md has no Unreleased section.')
        }
        def nextReleaseIndex = (unreleasedIndex + 1..<changelogLines.size()).find {
            changelogLines[it].startsWith('## ')
        }
        if (nextReleaseIndex == null) {
            throw new GradleException(
                    'Publication is blocked: CHANGELOG.md has no finalized release after Unreleased.')
        }
        def unreleasedContent = changelogLines.subList(unreleasedIndex + 1, nextReleaseIndex).findAll {
            !it.isBlank() && !it.trim().startsWith('<!--')
        }
        if (!unreleasedContent.isEmpty()) {
            throw new GradleException(
                    'Publication is blocked: CHANGELOG.md still contains Unreleased changes.')
        }
        def latestReleaseHeading = changelogLines[nextReleaseIndex]
        if (!latestReleaseHeading.startsWith("## ${project.version} - ")) {
            throw new GradleException(
                    "Publication is blocked: latest finalized CHANGELOG release is not ${project.version}.")
        }
        if (changelogLines.count { it.startsWith("## ${project.version} - ") } != 1) {
            throw new GradleException(
                    "Publication is blocked: CHANGELOG.md must contain exactly one ${project.version} release heading.")
        }

        def licenseText = file('LICENSE.txt').getText('UTF-8')
        if (mod_license == 'All Rights Reserved'
                && licenseText.contains('Unless noted below, Minecraft Forge, Forge Mod Loader')) {
            throw new GradleException(
                    'Publication is blocked: replace the stock Forge MDK LICENSE.txt with the intended '
                            + 'project license or proprietary notice, and keep mod_license in agreement.')
        }
    }
}

tasks.register('verifyRuntimeSmokeLog') {
    group = 'verification'
    description = 'Validates a captured client or dedicated-server startup log for release-blocking failures.'

    doLast {
        def kind = providers.gradleProperty('smokeKind').orNull
        def logPath = providers.gradleProperty('smokeLog').orNull
        if (!(kind in ['client', 'server'])) {
            throw new GradleException('Set -PsmokeKind=client or -PsmokeKind=server')
        }
        if (logPath == null || logPath.isBlank()) {
            throw new GradleException('Set -PsmokeLog=<path-to-latest.log-or-log.gz>')
        }

        def logFile = file(logPath)
        if (!logFile.isFile()) {
            throw new GradleException("Runtime smoke log does not exist: ${logFile}")
        }
        def logText = logFile.name.endsWith('.gz')
                ? new java.util.zip.GZIPInputStream(new FileInputStream(logFile)).withCloseable {
                    it.getText('UTF-8')
                }
                : logFile.getText('UTF-8')
        def requiredMarkers = kind == 'client'
                ? [
                        "Forge mod loading, version ${forge_version}, for MC ${minecraft_version}",
                        'Loaded config taczweaponblueprints:blueprint',
                        'Sound engine started'
                ]
                : [
                        'Applied blueprint research snapshot revision',
                        'Blueprint catalog initialized:',
                        'Dynamic blueprint loot distribution active:',
                        'Done ('
                ]
        def missingMarkers = requiredMarkers.findAll { !logText.contains(it) }
        if (!missingMarkers.isEmpty()) {
            throw new GradleException(
                    "${kind} smoke log is missing required startup markers: ${missingMarkers}")
        }

        def blockingPatterns = [
                ~/(?i)mixin apply failed[^\n]*taczweaponblueprints/,
                ~/(?i)taczweaponblueprints[^\n]*(invalidinjectionexception|nosuchmethoderror|noclassdeffounderror)/,
                ~/(?i)(invalidinjectionexception|nosuchmethoderror|noclassdeffounderror)[^\n]*taczweaponblueprints/,
                ~/(?i)(illegalargumentexception|illegalstateexception|indexoutofboundsexception|nullpointerexception):[^\n]*research tree/,
                ~/(?is)suspected mod:\s*(?:\r?\n\s*)?tacz weapon blueprints/,
                ~/(?i)failed to create mod instance[^\n]*taczweaponblueprints/,
                ~/(?i)\[(?:[^\]]*\/)?(?:fatal|error)\][^\n]*taczweaponblueprints/
        ]
        def blockingMatches = blockingPatterns.collectMany { pattern ->
            (logText =~ pattern).collect { it[0] }
        }.unique()
        if (!blockingMatches.isEmpty()) {
            throw new GradleException(
                    "${kind} smoke log contains release-blocking failures: ${blockingMatches}")
        }

        logger.lifecycle("Verified ${kind} runtime smoke log: ${logFile}")
    }
}

tasks.register('certifyReleaseCandidate') {
    group = 'verification'
    description = 'Runs publication gates and writes a machine-readable release-candidate artifact report.'
    dependsOn tasks.named('verifyPublicationReadiness')

    def reportFile = releaseCandidateReportFile
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })
    inputs.file('src/main/java/com/gamergaming/taczweaponblueprints/network/NetworkHandler.java')
    inputs.file(taperedAutomaticTopologyReportFile)
    inputs.file(groupedPrerequisiteAcceptanceReportFile)
    inputs.file(groupedRouteRolloutReportFile)
    inputs.file(groupedRouteSelectionReportFile)
    inputs.file(groupedRouteStabilizationReportFile)
    inputs.file(hybridRouteGenerationReportFile)
    inputs.file(groupedVisualRefinementReportFile)
    inputs.file(automaticPublicationRecoveryReportFile)
    inputs.files(layout.buildDirectory.dir('test-results/test'))
    inputs.properties([
            minecraft_version : minecraft_version,
            forge_version     : forge_version,
            tacz_version      : tacz_version,
            fzzy_config_version: fzzy_config_version,
            jei_version       : jei_version,
            emi_version       : emi_version
    ])
    outputs.file(reportFile)

    doLast {
        def javaSpecification = System.getProperty('java.specification.version')
        if (javaSpecification != '17') {
            throw new GradleException(
                    "Release certification requires JDK 17; current runtime is Java ${System.getProperty('java.version')}.")
        }

        def artifact = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        artifact.withInputStream { input ->
            def buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        def sha256 = digest.digest().encodeHex().toString()

        def protocolSource = file(
                'src/main/java/com/gamergaming/taczweaponblueprints/network/NetworkHandler.java')
                .getText('UTF-8')
        def protocolMatch = protocolSource =~ /PROTOCOL_VERSION\s*=\s*"([^"]+)"/
        if (!protocolMatch.find()) {
            throw new GradleException('Could not determine the network protocol from NetworkHandler')
        }

        def testSuites = fileTree("${buildDir}/test-results/test") {
            include 'TEST-*.xml'
        }.files.collect { new XmlSlurper().parse(it) }
        def sumAttribute = { String name ->
            testSuites.sum { suite -> (suite.attributes()[name]?.toString() ?: '0') as int } ?: 0
        }
        def report = [
                schema         : 1,
                project        : project.name,
