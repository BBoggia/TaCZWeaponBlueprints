tasks.register('generateResearchTechTreeRatings', JavaExec) {
    group = 'authoring'
    description = 'Extracts TaCZ gun-pack evidence and writes non-authoritative Tech Tree rating suggestions.'
    dependsOn tasks.named('authoringClasses')
    classpath = sourceSets.authoring.runtimeClasspath
    mainClass = 'com.gamergaming.taczweaponblueprints.research.tree.authoring.ResearchTechTreeRatingTool'

    def gunPack = providers.gradleProperty('researchGunPack')
            .orElse(layout.projectDirectory.dir('run/tacz/tacz_default_gun').asFile.absolutePath)
    def report = providers.gradleProperty('researchRatingReport')
            .orElse(layout.buildDirectory.file('reports/research-tech-tree/tacz-weapon-ratings.json')
                    .map { it.asFile.absolutePath })
    def appeal = providers.gradleProperty('researchAppealRatings')
            .orElse(layout.projectDirectory
                    .file('src/authoring/resources/tacz-1.1.8-appeal-ratings.json')
                    .asFile.absolutePath)
    def sourceVersion = providers.gradleProperty('researchGunPackVersion').orElse(tacz_version)
    def expectedGunCount = providers.gradleProperty('researchExpectedGunCount').orElse('53')

    inputs.dir(gunPack).withPropertyName('gunPackContents')
    inputs.property('gunPackPath', gunPack)
    inputs.property('sourceVersion', sourceVersion)
    inputs.property('expectedGunCount', expectedGunCount)
    inputs.files(appeal).withPropertyName('appealRatingsFile').optional()
    outputs.file(report)

    doFirst {
        args = [
                '--pack', gunPack.get(),
                '--output', report.get(),
                '--source-version', sourceVersion.get(),
                '--expected-count', expectedGunCount.get()
        ]
        args += ['--appeal', appeal.get()]
    }
}

