                        java.nio.file.StandardCopyOption.ATOMIC_MOVE,
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
                java.nio.file.Files.move(
                        temporaryReport,
                        output.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        } finally {
            java.nio.file.Files.deleteIfExists(temporaryReport)
        }
        logger.lifecycle("Phase 12 automatic publication recovery report: ${output}")
    }
}

tasks.register('verifyReleaseArtifact') {
    group = 'verification'
    description = 'Validates the reobfuscated release JAR, metadata, JSON, and generated loot index.'
    dependsOn invalidateReleaseCandidateReport,
            tasks.named('reobfJar'), tasks.named('test'),
            tasks.named('verifySharedLayoutKernelMigration'),
            tasks.named('verifyTaperedAutomaticTopologyContract'),
            tasks.named('verifyGroupedPrerequisiteAcceptanceContract'),
            tasks.named('verifyGroupedRouteRolloutContract'),
            tasks.named('verifyGroupedRouteSelectionContract'),
            tasks.named('verifyGroupedRouteStabilizationContract'),
            tasks.named('verifyHybridRouteGenerationContract'),
            tasks.named('verifyGroupedVisualRefinementContract'),
            tasks.named('verifyAutomaticPublicationRecoveryContract')

    doLast {
        def artifact = tasks.named('jar', Jar).get().archiveFile.get().asFile
        if (!artifact.isFile()) {
            throw new GradleException("Release artifact does not exist: ${artifact}")
        }

        def zip = new java.util.zip.ZipFile(artifact)
        try {
            def entries = java.util.Collections.list(zip.entries())
            def names = entries.collect { it.name }
            def forbidden = names.findAll {
                it == '.DS_Store' || it.endsWith('/.DS_Store') || it == '.cache/' || it.startsWith('.cache/') || it.contains('/.cache/')
                        || it == 'tacz-1.1.8-appeal-ratings.json'
                        || it.endsWith('/tacz-1.1.8-appeal-ratings.json')
                        || it == 'com/gamergaming/taczweaponblueprints/mixin/IScreenAccessor.class'
                        || it == 'com/gamergaming/taczweaponblueprints/menu/ResearchBenchActionValidator.class'
                        || it == 'com/gamergaming/taczweaponblueprints/menu/ResearchBenchPreview.class'
                        || it.startsWith(
                                'com/gamergaming/taczweaponblueprints/research/tree/authoring/')
            }
            if (!forbidden.isEmpty()) {
