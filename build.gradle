                        mergePolicy     : 'gradual_second_parent_taper_with_closure_guard',
                        packagedMergeInterval: 4,
                        progressionBands: 'tree_owned_none_dynamic_or_configured',
                        maxCandidates   : 4096,
                        exportFormat    : certifiedResearchCatalogExportFormat,
                        publicationContract: certifiedAutomaticPublicationContract,
                        publicationHealthContract:
                                certifiedAutomaticPublicationHealthContract,
                        publicationCompleteness:
                                'candidate_branch_coordinate_decision_finalized_rank',
                        incompleteCurrentPublication: 'reject_atomically',
                        compatibilityBranchEvidence: 'optional_never_inferred',
                        acceptanceCatalogSize: 287,
                        acceptanceReport:
                                'build/reports/tapered-automatic-topology.json',
                        recoveryReport:
                                'build/reports/automatic-publication-recovery.json',
                        publicationHealthStates:
                                ['empty', 'awaiting_rebuild', 'ready', 'failed'],
                        failureStageDiagnostics: true,
                        failureRecovery: 'new_revision_clears_stale_failure',
                        topologyGate   : 'verifyTaperedAutomaticTopologyContract',
                        recoveryGate   : 'verifyAutomaticPublicationRecoveryContract',
                        artifactGate    : 'verifyReleaseArtifact'
                ],
                researchPointEconomy: [
                        definitions          : 15,
                        fixedProgressionPoints: 46,
                        firstDiscoveryPoints : 1,
                        pinnedCatalogMaximum : 218,
                        pinnedResearchCost   : 1246,
                        allPolicyResearchCost: 1246,
                        enabledWeaponTreeCost: 418,
                        weaponLeafSinglePaths: [minimum: 10, maximum: 54],
                        weaponLeafClosures   : [minimum: 10, maximum: 88],
                        weaponAndMerges      : 16,
                        costAuthority        : 'research_policy',
                        automaticCostCurve   : false,
                        researchDataValues   : [note: 1, report: 3, dossier: 6],
                        finiteOverflow       : 'require_full',
                        combatDefault        : 'disabled',
                        artifactGate         : 'verifyReleaseArtifact'
                ],
                tests          : [
                        total   : sumAttribute('tests'),
                        failures: sumAttribute('failures'),
                        errors  : sumAttribute('errors'),
                        skipped : sumAttribute('skipped')
                ],
                artifact       : [
                        path  : project.relativePath(artifact),
                        bytes : artifact.length(),
                        sha256: sha256
                ]
        ]
        def output = reportFile.get().asFile
        output.parentFile.mkdirs()
        def reportText = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(report)) + '\n'
        def temporaryReport = java.nio.file.Files.createTempFile(
                output.parentFile.toPath(), 'release-candidate-', '.json.tmp')
        try {
            java.nio.file.Files.writeString(
                    temporaryReport,
                    reportText,
                    java.nio.charset.StandardCharsets.UTF_8)
            try {
                java.nio.file.Files.move(
                        temporaryReport,
                        output.toPath(),
                        java.nio.file.StandardCopyOption.ATOMIC_MOVE,
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
                java.nio.file.Files.move(
                        temporaryReport,
                        output.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        } finally {
            java.nio.file.Files.deleteIfExists(temporaryReport)
        }
        logger.lifecycle("Release candidate report: ${output}")
        logger.lifecycle("SHA-256: ${sha256}")
    }
}

