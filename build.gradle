        def edgeSuite =
                'com.gamergaming.taczweaponblueprints.client.ResearchTreeEdgeIndexTest'
        def textSuite =
                'com.gamergaming.taczweaponblueprints.client.ResearchTreeRequirementTextTest'
        def routePlannerSuite =
