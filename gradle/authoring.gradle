tasks.register('generateCapabilityComparisonReport', JavaExec) {
    group = 'authoring'
    description = 'Writes a full TaCZ v2-versus-v3 capability shadow comparison.'
    dependsOn tasks.named('authoringClasses')
    mustRunAfter tasks.named('generateCapabilityWeaponReference')
    classpath = sourceSets.authoring.runtimeClasspath
    mainClass = 'com.gamergaming.taczweaponblueprints.research.tree.authoring.ResearchCapabilityComparisonTool'

    def gunPack = providers.gradleProperty('researchGunPack')
            .orElse(layout.projectDirectory.dir('run/neoforge/client/tacz/tacz_default_gun').asFile.absolutePath)
    def output = providers.gradleProperty('researchCapabilityComparison')
            .orElse(layout.buildDirectory.file(
                    'reports/research-tech-tree/capability-v3-comparison.json')
                    .map { it.asFile.absolutePath })
    def expectedGunCount = providers.gradleProperty('researchExpectedGunCount').orElse('53')
    inputs.dir(gunPack).withPropertyName('gunPackContents')
    inputs.file('src/main/resources/assets/taczweaponblueprints/research/automatic/'
            + 'tacz-1.1.8-mechanical-v2.json')
    inputs.file('src/main/resources/assets/taczweaponblueprints/research/automatic/'
            + 'tacz-1.1.8-capability-v3.json')
    inputs.property('expectedGunCount', expectedGunCount)
    outputs.file(output)
    doFirst {
        args = [
                '--pack', gunPack.get(),
                '--output', output.get(),
                '--expected-count', expectedGunCount.get()
        ]
    }
}
