def taperedAutomaticTopologyReportFile =
        layout.buildDirectory.file('reports/tapered-automatic-topology.json')
tasks.register('verifyTaperedAutomaticTopologyContract') {
    group = 'verification'
    description = 'Certifies the Phase 10 automatic tapered-tree compatibility contract and regression suites.'
    dependsOn tasks.named('test')

    inputs.files(
            'src/main/java/com/gamergaming/taczweaponblueprints/research/tree/ResearchTechTreeContract.java',
            'src/main/java/com/gamergaming/taczweaponblueprints/network/NetworkHandler.java',
            'src/main/java/com/gamergaming/taczweaponblueprints/resource/research/BlueprintResearchCatalogExporter.java',
            'src/main/java/com/gamergaming/taczweaponblueprints/research/tree/ResearchGroupedRouteQualityAudit.java',
            'src/main/java/com/gamergaming/taczweaponblueprints/research/tree/ResearchGroupedRouteMotifAssessment.java')
    inputs.files(layout.buildDirectory.dir('test-results/test'))
    outputs.file(taperedAutomaticTopologyReportFile)

    doLast {
        def requireSourceConstant = { String path, java.util.regex.Pattern pattern,
                String expected, String label ->
            def source = file(path).getText('UTF-8')
            def matcher = source =~ pattern
            if (!matcher.find()) {
                throw new GradleException("Could not determine ${label} from ${path}")
            }
            def actual = matcher.group(1)
            if (actual != expected) {
                throw new GradleException(
                        "${label} changed from certified value ${expected} to ${actual}; "
                                + 'update the Phase 10 contract and migration documentation together')
            }
            actual
        }
        def placementVersion = requireSourceConstant(
                'src/main/java/com/gamergaming/taczweaponblueprints/research/tree/ResearchTechTreeContract.java',
                ~/AUTOMATIC_PLACEMENT_VERSION\s*=\s*"([^"]+)"/,
                certifiedAutomaticPlacementVersion,
                'automatic placement version')
        def protocolVersion = requireSourceConstant(
                'src/main/java/com/gamergaming/taczweaponblueprints/network/NetworkHandler.java',
                ~/PROTOCOL_VERSION\s*=\s*"([^"]+)"/,
                certifiedResearchTreeProtocol,
                'Research Tree protocol')
        def exportFormat = requireSourceConstant(
                'src/main/java/com/gamergaming/taczweaponblueprints/resource/research/BlueprintResearchCatalogExporter.java',
                ~/CURRENT_FORMAT\s*=\s*(\d+)/,
                certifiedResearchCatalogExportFormat.toString(),
                'research catalog export format')

        def requiredSuites = [
                'com.gamergaming.taczweaponblueprints.research.tree.automatic.AutomaticWeaponPrerequisitePlannerTest',
                'com.gamergaming.taczweaponblueprints.research.tree.automatic.AutomaticWeaponRankFinalizerTest',
                'com.gamergaming.taczweaponblueprints.research.tree.automatic.AutomaticWeaponPlacementDiagnosticsTest',
                'com.gamergaming.taczweaponblueprints.research.tree.ResearchGroupedRouteQualityAuditTest',
                'com.gamergaming.taczweaponblueprints.research.tree.automatic.ResearchGroupedRouteQualityBoundaryTest',
                'com.gamergaming.taczweaponblueprints.research.tree.automatic.ResearchGroupedRouteMotifAssessmentTest',
                'com.gamergaming.taczweaponblueprints.research.tree.automatic.tacz.AutomaticWeaponCandidateClassificationTest',
                'com.gamergaming.taczweaponblueprints.client.ResearchTechTreeLayoutEngineTest',
                'com.gamergaming.taczweaponblueprints.network.SyncResearchTreePacketTest',
                'com.gamergaming.taczweaponblueprints.resource.research.DefaultTaCZResearchTreeTest'
        ]
        def suiteEvidence = requiredSuites.collect { suiteName ->
            def result = file("${buildDir}/test-results/test/TEST-${suiteName}.xml")
            if (!result.isFile()) {
                throw new GradleException(
                        "Phase 10 regression suite did not run: ${suiteName}")
            }
            def suite = new XmlSlurper().parse(result)
            def evidence = [
                    suite   : suiteName,
                    tests   : (suite.@tests.toString() ?: '0') as int,
                    failures: (suite.@failures.toString() ?: '0') as int,
                    errors  : (suite.@errors.toString() ?: '0') as int,
                    skipped : (suite.@skipped.toString() ?: '0') as int
            ]
            if (evidence.tests < 1 || evidence.failures != 0 || evidence.errors != 0) {
                throw new GradleException(
                        "Phase 10 regression suite is not clean: ${evidence}")
            }
            evidence
        }

        def report = [
                schema             : 1,
                phase              : 10,
                status             : 'passed',
                placementVersion   : placementVersion,
                networkProtocol    : protocolVersion,
                exportFormat       : exportFormat as int,
                groupedRouteQuality: certifiedGroupedRouteQualityContract,
                groupedRouteMotifDecision: certifiedGroupedRouteMotifDecisionContract,
                publicationContract: certifiedAutomaticPublicationContract,
                invariants         : [
                        'canonical_branch_coordinates_for_every_connected_candidate',
                        'prerequisite_decision_for_every_connected_candidate',
                        'finalized_rank_for_every_connected_decision',
                        'atomic_rejection_of_incomplete_current_publications',
                        'no_fabricated_branch_coordinates_for_compatibility_plans',
                        'attachments_and_ammo_disabled_by_default'
                ],
                regressionSuites   : suiteEvidence,
                manualRuntimeGate  : 'docs/research-tree-manual-qa.md'
        ]
        def output = taperedAutomaticTopologyReportFile.get().asFile
        output.parentFile.mkdirs()
        def reportText = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(report)) + '\n'
        def temporaryReport = java.nio.file.Files.createTempFile(
                output.parentFile.toPath(), 'tapered-automatic-', '.json.tmp')
        try {
            java.nio.file.Files.writeString(
                    temporaryReport,
                    reportText,
                    java.nio.charset.StandardCharsets.UTF_8)
            try {
                java.nio.file.Files.move(
                        temporaryReport,
                        output.toPath(),
                        java.nio.file.StandardCopyOption.ATOMIC_MOVE,
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
                java.nio.file.Files.move(
                        temporaryReport,
                        output.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        } finally {
            java.nio.file.Files.deleteIfExists(temporaryReport)
        }
        logger.lifecycle("Phase 10 tapered automatic topology report: ${output}")
    }
}

def groupedPrerequisiteAcceptanceReportFile =
        layout.buildDirectory.file('reports/grouped-prerequisite-acceptance.json')
tasks.register('verifyGroupedPrerequisiteAcceptanceContract') {
    group = 'verification'
    description = 'Certifies the Phase 7 grouped-prerequisite truth tables and integration matrix.'
    dependsOn tasks.named('test')

    inputs.files(
            'src/test/java/com/gamergaming/taczweaponblueprints/resource/research/ResearchRequirementsTest.java',
            'src/test/java/com/gamergaming/taczweaponblueprints/resource/research/BlueprintResearchCodecTest.java',
            'src/test/java/com/gamergaming/taczweaponblueprints/progression/BlueprintResearchServiceTest.java',
            'src/test/java/com/gamergaming/taczweaponblueprints/research/tree/ResearchTreeBuilderTest.java',
            'src/test/java/com/gamergaming/taczweaponblueprints/network/SyncResearchTreePacketTest.java',
            'src/test/java/com/gamergaming/taczweaponblueprints/research/tree/automatic/AutomaticWeaponPrerequisitePlannerTest.java',
            'src/test/java/com/gamergaming/taczweaponblueprints/research/tree/automatic/AutomaticWeaponTopologyPhaseZeroFixtureTest.java')
    inputs.files(layout.buildDirectory.dir('test-results/test'))
    outputs.file(groupedPrerequisiteAcceptanceReportFile)

    doLast {
        def requirementsSuite =
                'com.gamergaming.taczweaponblueprints.resource.research.ResearchRequirementsTest'
        def codecSuite =
                'com.gamergaming.taczweaponblueprints.resource.research.BlueprintResearchCodecTest'
        def serviceSuite =
                'com.gamergaming.taczweaponblueprints.progression.BlueprintResearchServiceTest'
        def builderSuite =
                'com.gamergaming.taczweaponblueprints.research.tree.ResearchTreeBuilderTest'
        def networkSuite =
                'com.gamergaming.taczweaponblueprints.network.SyncResearchTreePacketTest'
        def plannerSuite =
                'com.gamergaming.taczweaponblueprints.research.tree.automatic.AutomaticWeaponPrerequisitePlannerTest'
        def baselineSuite =
                'com.gamergaming.taczweaponblueprints.research.tree.automatic.AutomaticWeaponTopologyPhaseZeroFixtureTest'
        def requiredCases = [
                [invariant: 'legacy_two_parent_and_truth_table',
                        suite: requirementsSuite,
                        test: 'legacySingletonTruthTableRemainsMandatoryAnd()'],
                [invariant: 'single_group_inclusive_or_truth_table',
                        suite: requirementsSuite,
                        test: 'singleAlternativeGroupTruthTableRemainsInclusiveOr()'],
                [invariant: 'and_across_groups_or_within_groups_truth_table',
                        suite: requirementsSuite,
                        test: 'canonicalModelExpressesAndAcrossGroupsAndOrWithinEachGroup()'],
                [invariant: 'legacy_rule_decode_to_singleton_groups',
                        suite: codecSuite,
                        test: 'legacyPrerequisiteFieldDecodesIntoSingletonGroups()'],
                [invariant: 'legacy_and_grouped_fields_are_mutually_exclusive',
                        suite: codecSuite,
                        test: 'groupedPrerequisitesAreVersionedCanonicalAndMutuallyExclusive()'],
                [invariant: 'stable_group_and_alternative_ordering',
                        suite: requirementsSuite,
                        test: 'alternativesAndGroupsHaveDeterministicOrderingAndEncoding()'],
                [invariant: 'duplicate_and_empty_groups_are_rejected',
                        suite: requirementsSuite,
                        test: 'codecRejectsUnknownFieldsEmptyGroupsAndDuplicates()'],
                [invariant: 'self_references_are_rejected',
                        suite: requirementsSuite,
                        test: 'malformedGroupsAndRequirementsAreRejectedStrictly()'],
                [invariant: 'conservative_union_cycles_are_rejected',
                        suite: requirementsSuite,
                        test: 'conservativeUnionGraphRejectsCyclesAndDepthOverflow()'],
                [invariant: 'generated_groups_filter_alternatives_independently',
                        suite: serviceSuite,
                        test: 'groupedOverlayFiltersAlternativesIndependentlyAndFailsOpenSafely()'],
                [invariant: 'all_blocked_generated_alternatives_fail_open',
                        suite: serviceSuite,
                        test: 'groupedOverlayFiltersAlternativesIndependentlyAndFailsOpenSafely()'],
                [invariant: 'exempt_alternative_satisfies_generated_group',
                        suite: serviceSuite,
                        test: 'groupedOverlayFiltersAlternativesIndependentlyAndFailsOpenSafely()'],
                [invariant: 'grouped_routes_work_in_atomic_research_transactions',
                        suite: serviceSuite,
                        test: 'groupedAutomaticRouteAcceptsEitherAlternativeButNotNeither()'],
                [invariant: 'partially_hidden_groups_retain_truthful_cardinality',
                        suite: builderSuite,
                        test: 'inducedProjectionPreservesCrossViewChoiceGroupsAsLinkedAlternatives()'],
                [invariant: 'group_identity_survives_server_publication',
                        suite: builderSuite,
                        test: 'publishesCanonicalChoiceGroupsAndTheirPlayerSpecificSatisfaction()'],
                [invariant: 'group_identity_and_hidden_counts_survive_network_sync',
                        suite: networkSuite,
                        test: 'groupedRequirementIdentityAndHiddenCountsRoundTrip()'],
                [invariant: 'grouped_routes_never_generate_a_third_parent',
                        suite: plannerSuite,
                        test: 'groupedRoutesRemainBoundedAtMaximumCatalogPopulation()'],
                [invariant: 'authored_prerequisites_retain_authority',
                        suite: serviceSuite,
                        test: 'connectedAutomaticPrerequisiteIsEnforcedByTheAtomicResearchTransaction()'],
                [invariant: 'legacy_and_topology_fixture_is_unchanged',
                        suite: baselineSuite,
                        test: 'currentTopologyBaselinesCoverRepresentativeCatalogSizes()'],
                [invariant: 'grouped_routes_are_deterministic_across_repeated_runs',
                        suite: plannerSuite,
                        test: 'groupedRoutesAreIdenticalAcrossRepeatedRuns()']
        ]

        def parsedSuites = [:]
        def evidence = requiredCases.collect { required ->
            def suite = parsedSuites.computeIfAbsent(required.suite) { suiteName ->
                def result = file(
                        "${buildDir}/test-results/test/TEST-${suiteName}.xml")
                if (!result.isFile()) {
                    throw new GradleException(
                            "Phase 7 acceptance suite did not run: ${suiteName}")
                }
                new XmlSlurper().parse(result)
            }
            def testCase = suite.testcase.find {
                it.@name.toString() == required.test
            }
            if (testCase == null || testCase.size() == 0) {
                throw new GradleException(
                        "Phase 7 acceptance case did not run: ${required.suite}#${required.test}")
            }
            if (testCase.failure.size() != 0 || testCase.error.size() != 0
                    || testCase.skipped.size() != 0) {
                throw new GradleException(
                        "Phase 7 acceptance case is not clean: ${required.suite}#${required.test}")
            }
            [
                    invariant: required.invariant,
                    suite    : required.suite,
                    test     : required.test,
                    status   : 'passed'
            ]
        }
        if (evidence*.invariant.toSet().size() != requiredCases.size()) {
            throw new GradleException(
                    'Phase 7 acceptance matrix contains duplicate invariant identifiers')
        }

        def report = [
                schema          : 1,
                phase           : 7,
                status          : 'passed',
                contract        : certifiedGroupedPrerequisiteAcceptanceContract,
                prerequisiteStrategy: certifiedAutomaticPrerequisiteStrategy,
                networkProtocol : certifiedResearchTreeProtocol,
                exportFormat    : certifiedResearchCatalogExportFormat,
                invariantCount  : evidence.size(),
                evidence        : evidence
        ]
        def output = groupedPrerequisiteAcceptanceReportFile.get().asFile
        output.parentFile.mkdirs()
        def reportText = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(report)) + '\n'
        def temporaryReport = java.nio.file.Files.createTempFile(
                output.parentFile.toPath(), 'grouped-acceptance-', '.json.tmp')
        try {
            java.nio.file.Files.writeString(
                    temporaryReport,
                    reportText,
                    java.nio.charset.StandardCharsets.UTF_8)
            try {
                java.nio.file.Files.move(
                        temporaryReport,
                        output.toPath(),
                        java.nio.file.StandardCopyOption.ATOMIC_MOVE,
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
                java.nio.file.Files.move(
                        temporaryReport,
                        output.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        } finally {
            java.nio.file.Files.deleteIfExists(temporaryReport)
        }
        logger.lifecycle("Phase 7 grouped-prerequisite acceptance report: ${output}")
    }
}

