def taperedAutomaticTopologyReportFile =
        layout.buildDirectory.file('reports/tapered-automatic-topology.json')
tasks.register('verifyTaperedAutomaticTopologyContract') {
    group = 'verification'
    description = 'Certifies the Phase 10 automatic tapered-tree compatibility contract and regression suites.'
    dependsOn tasks.named('test')

    inputs.files(
            'src/main/java/com/gamergaming/taczweaponblueprints/research/tree/ResearchTechTreeContract.java',
            'src/main/java/com/gamergaming/taczweaponblueprints/network/NetworkHandler.java',
            'src/main/java/com/gamergaming/taczweaponblueprints/resource/research/BlueprintResearchCatalogExporter.java')
    inputs.files(layout.buildDirectory.dir('test-results/test'))
    outputs.file(taperedAutomaticTopologyReportFile)

    doLast {
        def requireSourceConstant = { String path, java.util.regex.Pattern pattern,
                String expected, String label ->
            def source = file(path).getText('UTF-8')
            def matcher = source =~ pattern
            if (!matcher.find()) {
                throw new GradleException("Could not determine ${label} from ${path}")
            }
            def actual = matcher.group(1)
            if (actual != expected) {
                throw new GradleException(
                        "${label} changed from certified value ${expected} to ${actual}; "
                                + 'update the Phase 10 contract and migration documentation together')
            }
            actual
        }
        def placementVersion = requireSourceConstant(
                'src/main/java/com/gamergaming/taczweaponblueprints/research/tree/ResearchTechTreeContract.java',
                ~/AUTOMATIC_PLACEMENT_VERSION\s*=\s*"([^"]+)"/,
                certifiedAutomaticPlacementVersion,
                'automatic placement version')
        def protocolVersion = requireSourceConstant(
                'src/main/java/com/gamergaming/taczweaponblueprints/network/NetworkHandler.java',
                ~/PROTOCOL_VERSION\s*=\s*"([^"]+)"/,
                certifiedResearchTreeProtocol,
                'Research Tree protocol')
        def exportFormat = requireSourceConstant(
                'src/main/java/com/gamergaming/taczweaponblueprints/resource/research/BlueprintResearchCatalogExporter.java',
                ~/CURRENT_FORMAT\s*=\s*(\d+)/,
                certifiedResearchCatalogExportFormat.toString(),
                'research catalog export format')

        def requiredSuites = [
                'com.gamergaming.taczweaponblueprints.research.tree.automatic.AutomaticWeaponPrerequisitePlannerTest',
                'com.gamergaming.taczweaponblueprints.research.tree.automatic.AutomaticWeaponRankFinalizerTest',
                'com.gamergaming.taczweaponblueprints.research.tree.automatic.AutomaticWeaponPlacementDiagnosticsTest',
                'com.gamergaming.taczweaponblueprints.research.tree.automatic.tacz.AutomaticWeaponCandidateClassificationTest',
                'com.gamergaming.taczweaponblueprints.client.ResearchTechTreeLayoutEngineTest',
                'com.gamergaming.taczweaponblueprints.network.SyncResearchTreePacketTest',
                'com.gamergaming.taczweaponblueprints.resource.research.DefaultTaCZResearchTreeTest'
        ]
        def suiteEvidence = requiredSuites.collect { suiteName ->
            def result = file("${buildDir}/test-results/test/TEST-${suiteName}.xml")
            if (!result.isFile()) {
                throw new GradleException(
                        "Phase 10 regression suite did not run: ${suiteName}")
            }
            def suite = new XmlSlurper().parse(result)
            def evidence = [
                    suite   : suiteName,
                    tests   : (suite.@tests.toString() ?: '0') as int,
                    failures: (suite.@failures.toString() ?: '0') as int,
                    errors  : (suite.@errors.toString() ?: '0') as int,
                    skipped : (suite.@skipped.toString() ?: '0') as int
            ]
            if (evidence.tests < 1 || evidence.failures != 0 || evidence.errors != 0) {
                throw new GradleException(
                        "Phase 10 regression suite is not clean: ${evidence}")
            }
            evidence
        }

        def report = [
                schema             : 1,
                phase              : 10,
                status             : 'passed',
                placementVersion   : placementVersion,
                networkProtocol    : protocolVersion,
                exportFormat       : exportFormat as int,
                publicationContract: certifiedAutomaticPublicationContract,
                invariants         : [
                        'canonical_branch_coordinates_for_every_connected_candidate',
                        'prerequisite_decision_for_every_connected_candidate',
                        'finalized_rank_for_every_connected_decision',
                        'atomic_rejection_of_incomplete_current_publications',
                        'no_fabricated_branch_coordinates_for_compatibility_plans',
                        'attachments_and_ammo_disabled_by_default'
                ],
                regressionSuites   : suiteEvidence,
                manualRuntimeGate  : 'docs/research-tree-manual-qa.md'
        ]
        def output = taperedAutomaticTopologyReportFile.get().asFile
        output.parentFile.mkdirs()
        def reportText = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(report)) + '\n'
        def temporaryReport = java.nio.file.Files.createTempFile(
                output.parentFile.toPath(), 'tapered-automatic-', '.json.tmp')
        try {
            java.nio.file.Files.writeString(
                    temporaryReport,
                    reportText,
                    java.nio.charset.StandardCharsets.UTF_8)
            try {
                java.nio.file.Files.move(
                        temporaryReport,
                        output.toPath(),
                        java.nio.file.StandardCopyOption.ATOMIC_MOVE,
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
                java.nio.file.Files.move(
                        temporaryReport,
                        output.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        } finally {
            java.nio.file.Files.deleteIfExists(temporaryReport)
        }
        logger.lifecycle("Phase 10 tapered automatic topology report: ${output}")
    }
}

def automaticPublicationRecoveryReportFile =
        layout.buildDirectory.file('reports/automatic-publication-recovery.json')
tasks.register('verifyAutomaticPublicationRecoveryContract') {
    group = 'verification'
    description = 'Certifies Phase 12 automatic-publication failure observability and recovery.'
    dependsOn tasks.named('test')

    inputs.files(
            'src/main/java/com/gamergaming/taczweaponblueprints/research/tree/automatic/tacz/AutomaticWeaponPlacementCandidateManager.java',
            'src/main/java/com/gamergaming/taczweaponblueprints/command/sub/BlueprintResearchCommand.java',
            'src/main/resources/assets/taczweaponblueprints/lang/en_us.json')
    inputs.files(layout.buildDirectory.dir('test-results/test'))
    outputs.file(automaticPublicationRecoveryReportFile)

    doLast {
        def suiteName =
                'com.gamergaming.taczweaponblueprints.research.tree.automatic.tacz.AutomaticWeaponEvidenceManagerTest'
        def result = file("${buildDir}/test-results/test/TEST-${suiteName}.xml")
        if (!result.isFile()) {
            throw new GradleException(
                    "Phase 12 publication recovery suite did not run: ${suiteName}")
        }
        def suite = new XmlSlurper().parse(result)
        def requiredRegressionTests = [
                'candidatePublicationIsRevisionCoupledAndInvalidatesAtomically',
                'candidatePublicationRetainsBoundedFailureStageUntilRecoveryStarts',
                'candidateRebuildFailuresAreAtomicAndRecoverAcrossEveryDeclaredStage',
                'nonemptyCandidatePublicationFailsClosedWithoutLeakingPartialStages',
                'candidatePublicationRevisionRolloverRemainsPositive'
        ]
        def executedRegressionTests = suite.testcase.collect {
            it.@name.toString().replaceFirst(/\(\)$/, '')
        }.toSet()
        def missingRegressionTests = requiredRegressionTests.findAll {
            !executedRegressionTests.contains(it)
        }
        def suiteEvidence = [
                suite   : suiteName,
                tests   : (suite.@tests.toString() ?: '0') as int,
                failures: (suite.@failures.toString() ?: '0') as int,
                errors  : (suite.@errors.toString() ?: '0') as int,
                skipped : (suite.@skipped.toString() ?: '0') as int,
                requiredTests: requiredRegressionTests,
                missingRequiredTests: missingRegressionTests
        ]
        if (!missingRegressionTests.isEmpty()
                || suiteEvidence.failures != 0 || suiteEvidence.errors != 0) {
            throw new GradleException(
                    "Phase 12 publication recovery suite is not clean: ${suiteEvidence}")
        }

        def language = new groovy.json.JsonSlurper().parse(
                file('src/main/resources/assets/taczweaponblueprints/lang/en_us.json'),
                'UTF-8')
        def requiredTranslations = [
                'commands.taczweaponblueprints.research.automatic.state',
                'commands.taczweaponblueprints.research.automatic.last_failure'
        ]
        def missingTranslations = requiredTranslations.findAll { key ->
            !(language[key] instanceof String) || language[key].isBlank()
        }
        if (!missingTranslations.isEmpty()) {
            throw new GradleException(
                    "Phase 12 publication health translations are missing: ${missingTranslations}")
        }
        if (!language['commands.taczweaponblueprints.research.automatic']
                        .contains('resolved visual-row capacity')
                || !language['commands.taczweaponblueprints.research.topology']
                        .contains('widest semantic rank')) {
            throw new GradleException(
                    'Research status must distinguish visual-row capacity from semantic-rank width')
        }

        def report = [
                schema          : 1,
                phase           : 12,
                status          : 'passed',
                healthContract  : certifiedAutomaticPublicationHealthContract,
                states          : ['empty', 'awaiting_rebuild', 'ready', 'failed'],
                failureStages   : [
                        'classification', 'positioning', 'prerequisite_planning',
                        'rank_finalization', 'rank_reconciliation', 'publication'
                ],
                maximumFailureMessageCharacters: 512,
                recoveryPolicy : 'new_revision_clears_stale_failure',
                stageCoverage  : 'real_rebuild_fault_injection_for_every_declared_stage',
                revisionRollover: 'long_maximum_wraps_to_one_zero_reserved_for_empty',
                operatorSurface: '/gg research status',
                regressionSuite: suiteEvidence
        ]
        def output = automaticPublicationRecoveryReportFile.get().asFile
        output.parentFile.mkdirs()
        def reportText = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(report)) + '\n'
        def temporaryReport = java.nio.file.Files.createTempFile(
                output.parentFile.toPath(), 'automatic-recovery-', '.json.tmp')
        try {
            java.nio.file.Files.writeString(
                    temporaryReport,
                    reportText,
                    java.nio.charset.StandardCharsets.UTF_8)
            try {
                java.nio.file.Files.move(
                        temporaryReport,
                        output.toPath(),
                        java.nio.file.StandardCopyOption.ATOMIC_MOVE,
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
                java.nio.file.Files.move(
                        temporaryReport,
                        output.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        } finally {
            java.nio.file.Files.deleteIfExists(temporaryReport)
        }
        logger.lifecycle("Phase 12 automatic publication recovery report: ${output}")
    }
}

