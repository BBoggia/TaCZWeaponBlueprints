            def missing = required.findAll { !names.contains(it) }
            if (!missing.isEmpty()) {
                throw new GradleException("Release artifact is missing required entries: ${missing}")
            }

            def modifierFiles = names.findAll {
                it.startsWith('data/taczweaponblueprints/loot_modifiers/') && it.endsWith('.json')
            }
            if (modifierFiles.size() != 494) {
                throw new GradleException("Expected 494 packaged loot modifiers, found ${modifierFiles.size()}")
            }
            def schemaFiles = names.findAll {
                (it.startsWith('data/taczweaponblueprints/taczweaponblueprints/loot_pools/')
                        || it.startsWith('data/taczweaponblueprints/taczweaponblueprints/loot_rules/'))
                        && it.endsWith('.json')
            }
            if (schemaFiles.size() != 12) {
                throw new GradleException("Expected 12 built-in pool/rule resources, found ${schemaFiles.size()}")
            }
            def researchProfileFiles = names.findAll {
                it.startsWith('data/taczweaponblueprints/taczweaponblueprints/research_profiles/')
                        && it.endsWith('.json')
            }
            if (researchProfileFiles.size() != 1) {
                throw new GradleException(
                        "Expected one built-in research profile, found ${researchProfileFiles.size()}")
            }
            def researchRuleFiles = names.findAll {
                it.startsWith('data/taczweaponblueprints/taczweaponblueprints/research_rules/default_tree/')
                        && it.endsWith('.json')
            }
            if (researchRuleFiles.size() != 55) {
                throw new GradleException(
                        "Expected 55 built-in default-tree research rules, found ${researchRuleFiles.size()}")
            }
            def researchGroupFiles = names.findAll {
                it.startsWith('data/taczweaponblueprints/taczweaponblueprints/research_tree_groups/')
                        && it.endsWith('.json')
            }
            if (researchGroupFiles.size() != 7) {
                throw new GradleException(
                        "Expected seven built-in research-tree groups, found ${researchGroupFiles.size()}")
            }
            def researchTechTreeFiles = names.findAll {
                it.startsWith('data/taczweaponblueprints/taczweaponblueprints/research_tech_trees/')
                        && it.endsWith('.json')
            }
            if (researchTechTreeFiles.size() != 1) {
                throw new GradleException(
                        "Expected one built-in Research Tech Tree, found ${researchTechTreeFiles.size()}")
            }
            def researchTechTreeEntryFiles = names.findAll {
                it.startsWith('data/taczweaponblueprints/taczweaponblueprints/research_tech_tree_entries/')
                        && it.endsWith('.json')
            }
            if (researchTechTreeEntryFiles.size() != 4) {
                throw new GradleException(
                        "Expected four built-in Research Tech Tree entry bundles, found ${researchTechTreeEntryFiles.size()}")
            }
            def automaticPlacementProfileFiles = names.findAll {
                it.startsWith('data/taczweaponblueprints/taczweaponblueprints/research_automatic_placement_profiles/')
                        && it.endsWith('.json')
            }
            if (automaticPlacementProfileFiles.size() != 1) {
                throw new GradleException(
                        "Expected one built-in automatic-placement profile, found ${automaticPlacementProfileFiles.size()}")
            }
            def researchPointAwardFiles = names.findAll {
                it.startsWith('data/taczweaponblueprints/taczweaponblueprints/research_point_awards/')
                        && it.endsWith('.json')
            }
            if (researchPointAwardFiles.size() != 15) {
                throw new GradleException(
                        "Expected 15 built-in Research Point awards, found ${researchPointAwardFiles.size()}")
            }

            def jsonParser = new groovy.json.JsonSlurper()
            entries.findAll { !it.directory && it.name.endsWith('.json') }.each { entry ->
                try {
                    zip.getInputStream(entry).withCloseable { stream ->
                        jsonParser.parse(stream, 'UTF-8')
                    }
                } catch (Exception exception) {
                    throw new GradleException("Invalid packaged JSON ${entry.name}", exception)
                }
            }

            def parsePackagedJson = { String path ->
                def entry = zip.getEntry(path)
                zip.getInputStream(entry).withCloseable { stream ->
                    jsonParser.parse(stream, 'UTF-8')
                }
            }
            def recyclerModelPath =
                    'assets/taczweaponblueprints/models/block/blueprint_recycler.json'
            def recyclerModel = parsePackagedJson(recyclerModelPath)
            def recyclerElementNames = [
                    'cabinet', 'top_deck', 'rear_console', 'paper_intake',
                    'output_drawer', 'front_left_foot', 'front_right_foot', 'rear_feet'
            ] as Set
            def recyclerTexture = 'taczweaponblueprints:block/blueprint_recycler'
            if (recyclerModel['parent'] != 'minecraft:block/block'
                    || recyclerModel['ambientocclusion'] != false
                    || recyclerModel['textures']?.keySet()
                            != (['particle', 'side', 'front', 'top', 'control'] as Set)
                    || recyclerModel['textures']?.values()?.toSet() != ([recyclerTexture] as Set)
                    || !(recyclerModel['elements'] instanceof List)
                    || recyclerModel['elements'].size() != 8
                    || recyclerModel['elements'].collect { it['name'] }.toSet()
                            != recyclerElementNames
                    || recyclerModel['elements'].any { element ->
                        !(element['from'] instanceof List) || element['from'].size() != 3
                                || !(element['to'] instanceof List) || element['to'].size() != 3
                                || (0..<3).any { axis ->
                                    !(element['from'][axis] instanceof Number)
                                            || !(element['to'][axis] instanceof Number)
                                            || element['from'][axis] < 0
                                            || element['to'][axis] > 16
                                            || element['from'][axis] >= element['to'][axis]
                                }
                                || element['faces']?.keySet()
                                        != (['north', 'east', 'south', 'west', 'up', 'down'] as Set)
                                || element['faces'].values().any { face ->
                                    !(face['texture'] instanceof String)
                                            || !face['texture'].startsWith('#')
                                            || !(face['uv'] instanceof List) || face['uv'].size() != 4
                                            || face['uv'].any { coordinate ->
                                                !(coordinate instanceof Number)
                                                        || coordinate < 0 || coordinate > 16
                                            }
                                }
                    }) {
                throw new GradleException(
                        'Packaged Blueprint Recycler model is not the final bounded eight-part workstation')
            }
            def recyclerBlockstate = parsePackagedJson(
                    'assets/taczweaponblueprints/blockstates/blueprint_recycler.json')
            def recyclerVariants = recyclerBlockstate['variants']
            def expectedRecyclerRotations = [
                    'facing=north': 0,
                    'facing=east' : 90,
                    'facing=south': 180,
                    'facing=west' : 270
            ]
            if (!(recyclerVariants instanceof Map)
                    || recyclerVariants.keySet() != expectedRecyclerRotations.keySet()
                    || expectedRecyclerRotations.any { state, rotation ->
                        recyclerVariants[state]?.get('model')
                                != 'taczweaponblueprints:block/blueprint_recycler'
                                || (recyclerVariants[state].containsKey('y')
                                        ? recyclerVariants[state]['y'] : 0) != rotation
                    }) {
                throw new GradleException(
                        'Packaged Blueprint Recycler blockstate must preserve all four horizontal facings')
            }
            def recyclerItemModel = parsePackagedJson(
                    'assets/taczweaponblueprints/models/item/blueprint_recycler.json')
            if (recyclerItemModel != [
                    parent: 'taczweaponblueprints:block/blueprint_recycler'
            ]) {
                throw new GradleException(
                        'Packaged Blueprint Recycler item must inherit the final block model')
            }
            def recyclerTextureEntry = zip.getEntry(
                    'assets/taczweaponblueprints/textures/block/blueprint_recycler.png')
            def recyclerTextureImage = zip.getInputStream(recyclerTextureEntry).withCloseable { stream ->
                javax.imageio.ImageIO.read(stream)
            }
            if (recyclerTextureImage == null
                    || recyclerTextureImage.width != 256
                    || recyclerTextureImage.height != 256) {
                throw new GradleException(
                        'Packaged Blueprint Recycler texture must be a readable 256x256 PNG')
            }
            def packagedAwards = researchPointAwardFiles.sort().collectEntries { path ->
                [(path): parsePackagedJson(path)]
            }
            def awardTriggerCounts = packagedAwards.values().countBy {
                it['trigger']?.get('type')
            }
            if (awardTriggerCounts != [
                    advancement_completed: 6,
                    blueprint_discovered: 1,
                    blueprint_milestone: 5,
                    inventory_turn_in: 3
            ]) {
                throw new GradleException(
                        "Packaged Research Point trigger mix changed without an economy review: ${awardTriggerCounts}")
            }
            def researchDataValues = packagedAwards.findAll { path, award ->
                award['trigger']?.get('type') == 'inventory_turn_in'
            }.values().collectEntries { award ->
                [(award['trigger']['target']['ids'].first()): award['reward']['points']]
            }
            if (researchDataValues != [
                    'taczweaponblueprints:research_note': 1,
                    'taczweaponblueprints:research_report': 3,
                    'taczweaponblueprints:research_dossier': 6
            ] || packagedAwards.values().any { award ->
