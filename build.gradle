plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
    // id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}


version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Phase 11 extends the public automatic-tree compatibility tuple with explicit
// opt-in hybrid-generation evidence. Deliberate changes must update runtime
// constants, release gates, and migration documentation together.
def certifiedAutomaticPlacementVersion = 'tacz-gun-placement-v13'
def certifiedResearchTreeProtocol = '42'
def certifiedResearchCatalogExportFormat = 18
def certifiedAutomaticPrerequisiteStrategy = 'grouped_routes_v1'
def certifiedAutomaticScoringModel = 'capability_v3'
def certifiedAutomaticFormulaVersion = 'tacz-gun-capability-v3'
def certifiedAutomaticReferenceVersion = 'tacz-1.1.8-capability-v3'
def certifiedGroupedRouteQualityContract = 'distributions-warnings-v1'
def certifiedGroupedRouteMotifDecisionContract = 'evidence-gate-v1'
def certifiedGroupedPrerequisiteAcceptanceContract =
        'truth-tables-integration-v1'
def certifiedGroupedRouteRolloutContract =
        'grouped-routes-v1-rollout-v1'
def certifiedGroupedRouteSelectionContract =
        'group-aware-route-balance-v1'
def certifiedGroupedRouteStabilizationContract =
        'default-rollout-migration-v1'
def certifiedHybridRouteGenerationContract =
        'deliberate-hybrid-generation-v1'
def certifiedGroupedVisualRefinementContract =
        'branch-aware-visual-refinement-v1'
def certifiedAutomaticPublicationContract =
        'canonical-branches-decisions-finalized-ranks-v1'
def certifiedAutomaticPublicationHealthContract =
        'staged-failure-recovery-v1'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)


mixin {
    add sourceSets.main, "/META-INF/${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"

    // debug = true
    // verbose = true
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    //  mappings channel: 'parchment', version: '2023.09.03-1.20.1'

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
     enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    // accessTransformer = project.file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id

            // EMI API is required for client-side mods
            // property 'mixin.env.remapRefMap', 'true'
            // property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            // property 'mixin.env.remapRefMap', 'true'
            // property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            // args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets {
    main {
        ext.refMap = "/META-INF/${mod_id}.refmap.json"
    }
    authoring {
        java.srcDir 'src/authoring/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    test {
        compileClasspath += sourceSets.authoring.output
        runtimeClasspath += sourceSets.authoring.output
    }
}

configurations {
    authoringImplementation.extendsFrom implementation
    authoringRuntimeOnly.extendsFrom runtimeOnly
}

// Include generated data, but never package the data generator's cache metadata.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
    exclude '**/.DS_Store'
}

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        // Add curse maven to repositories
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }
    maven {
        name = "FzzyMaven"
        url = "https://maven.fzzyhmstrs.me/"
    }
    maven {
        // location of the maven that hosts JEI files before January 2023
        name = "Progwml6's maven"
        url = "https://dvs1.progwml6.com/files/maven/"
        content {
            includeGroup "mezz.jei"
        }
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Roughly Enough Items"
        url = "https://maven.shedaniel.me"
    }
    maven {
        name = "EMI"
        url = uri("https://maven.terraformersmc.com/")
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

