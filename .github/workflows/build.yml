name: NeoForge development build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neoforge-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-addon:
    name: Regression tests, packaged artifact, and verification fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          properties = dict(line.split('=', 1) for line in Path('gradle.properties').read_text().splitlines()
                            if '=' in line and not line.lstrip().startswith('#'))
          version = properties['mod_version']
          if version.endswith('-dev') or os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Release tags must match the finalized mod_version.')
          PY
      - name: Verify the addon and compile the isolated game fixtures
        run: ./gradlew verifyRegressionEvidence testReleaseGates verifyReleaseArtifact portBootstrapClasses portVerificationClasses packageAnalyzerDatapacks packageResearchEconomyDatapacks --warning-mode all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neoforge-validation-reports
          path: build/neoforge/reports/
      # Installed-game checks require a desktop and run separately before release.
      # This build verifies code and packaging; it does not publish a release.
