                        "${buildDir}/test-results/test/TEST-${suiteName}.xml")
                if (!result.isFile()) {
                    throw new GradleException(
                            "Phase 10 stabilization suite did not run: ${suiteName}")
                }
                new XmlSlurper().parse(result)
            }
            def testCase = suite.testcase.find {
                it.@name.toString() == required.test
            }
            if (testCase == null || testCase.size() == 0) {
                throw new GradleException(
                        "Phase 10 stabilization case did not run: ${required.suite}#${required.test}")
            }
            if (testCase.failure.size() != 0 || testCase.error.size() != 0
                    || testCase.skipped.size() != 0) {
                throw new GradleException(
                        "Phase 10 stabilization case is not clean: ${required.suite}#${required.test}")
            }
            [
                    invariant: required.invariant,
                    suite    : required.suite,
                    test     : required.test,
                    status   : 'passed'
            ]
        }
        if (evidence*.invariant.toSet().size() != requiredCases.size()) {
            throw new GradleException(
                    'Phase 10 stabilization matrix contains duplicate invariant identifiers')
        }

        def parser = new groovy.json.JsonSlurper()
        def acceptance = parser.parse(
                groupedPrerequisiteAcceptanceReportFile.get().asFile)
        def rollout = parser.parse(groupedRouteRolloutReportFile.get().asFile)
        def selection = parser.parse(groupedRouteSelectionReportFile.get().asFile)
        if (acceptance['status'] != 'passed'
                || acceptance['contract']
                        != certifiedGroupedPrerequisiteAcceptanceContract
                || rollout['status'] != 'passed'
                || rollout['contract'] != certifiedGroupedRouteRolloutContract
                || rollout['activation']
                        != 'packaged_default_with_legacy_and_opt_out'
                || rollout['defaultDomains']
                        != [weapons: 'enabled', attachments: 'disabled', ammo: 'disabled']
                || selection['status'] != 'passed'
                || selection['contract'] != certifiedGroupedRouteSelectionContract
                || selection['groupedGuard'] != 'group_aware_route_balance_v1'
                || [acceptance, rollout, selection].any {
                    it['prerequisiteStrategy'] != certifiedAutomaticPrerequisiteStrategy
                            || it['networkProtocol'] != certifiedResearchTreeProtocol
                            || it['exportFormat'] != certifiedResearchCatalogExportFormat
                }) {
            throw new GradleException(
                    'Phase 10 stabilization does not have matching Phase 7-9 evidence')
        }

        def automaticProfile = parser.parse(file(
                'src/main/resources/data/taczweaponblueprints/taczweaponblueprints/research_automatic_placement_profiles/default.json'))
        if (automaticProfile['format'] != 4
                || automaticProfile['mode'] != 'connected'
                || automaticProfile['max_prerequisites'] != 2
                || automaticProfile['prerequisite_strategy']
                        != certifiedAutomaticPrerequisiteStrategy
                || automaticProfile['scoring_model']
                        != certifiedAutomaticScoringModel) {
            throw new GradleException(
                    'Phase 10 packaged automatic profile is not the bounded grouped default')
        }

        def report = [
                schema          : 1,
                phase           : 10,
                status          : 'passed',
                contract        : certifiedGroupedRouteStabilizationContract,
                prerequisiteStrategy: certifiedAutomaticPrerequisiteStrategy,
                scoringModel   : certifiedAutomaticScoringModel,
                activation      : 'packaged_default',
                legacyFallback  : [
                        strategy: 'legacy_and',
                        selection: 'explicit_or_omitted_for_compatible_profiles',
                        semanticFallback: 'never_implicit_on_grouped_failure'
                ],
                migration       : [
                        saveMigration: 'none',
                        learnedBlueprints: 'preserved',
                        datapackRewrite: 'none',
                        invalidGeneratedGroup: 'fail_open_with_diagnostics',
                        invalidAuthoredGroup: 'fail_closed'
                ],
                defaultDomains  : rollout['defaultDomains'],
                networkProtocol : certifiedResearchTreeProtocol,
                exportFormat    : certifiedResearchCatalogExportFormat,
                upstream        : [
                        acceptance: certifiedGroupedPrerequisiteAcceptanceContract,
                        rollout: certifiedGroupedRouteRolloutContract,
                        selection: certifiedGroupedRouteSelectionContract
                ],
                scaleCatalogs   : [53, 287, 4096],
                manualAcceptance: [
                        policy: 'required_before_public_release',
                        checklist: 'docs/research-tree-manual-qa.md',
                        items: [
                                'normal_and_maximum_zoom_out',
                                'route_selection_and_highlighting',
                                'junction_clarity',
                                'no_camera_reset_after_learning',
                                'no_top_heavy_or_excessive_width_regression'
                        ]
                ],
                invariantCount  : evidence.size(),
                evidence        : evidence
        ]
        def output = groupedRouteStabilizationReportFile.get().asFile
        output.parentFile.mkdirs()
        def reportText = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(report)) + '\n'
        def temporaryReport = java.nio.file.Files.createTempFile(
                output.parentFile.toPath(), 'grouped-route-stabilization-', '.json.tmp')
        try {
            java.nio.file.Files.writeString(
                    temporaryReport,
                    reportText,
                    java.nio.charset.StandardCharsets.UTF_8)
            try {
                java.nio.file.Files.move(
                        temporaryReport,
                        output.toPath(),
                        java.nio.file.StandardCopyOption.ATOMIC_MOVE,
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
                java.nio.file.Files.move(
                        temporaryReport,
                        output.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        } finally {
            java.nio.file.Files.deleteIfExists(temporaryReport)
        }
        logger.lifecycle("Phase 10 grouped-route stabilization report: ${output}")
    }
}

